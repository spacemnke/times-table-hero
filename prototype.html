<meta charset="utf-8" />
<title>Quest Land — Prototype (8-bit)</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#5c94fc" />
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;}
  html,body{height:100%;overflow:hidden;background:#0b0d18;font-family:ui-monospace,"Courier New",monospace;-webkit-user-select:none;user-select:none;}
  #game{position:fixed;inset:0;}
  #c{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;}

  .hud{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);left:10px;right:10px;display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none;z-index:5;}
  .hud.hidden{display:none;}
  .box8{background:#101828;border:3px solid #fff;box-shadow:3px 3px 0 #000;color:#fff;font-weight:700;padding:5px 9px;font-size:13px;letter-spacing:.02em;image-rendering:pixelated;}
  #hudHearts{display:flex;gap:3px;} #hudHearts canvas{width:20px;height:18px;image-rendering:pixelated;}
  .hmid{text-align:center;line-height:1.15;} .hmid small{display:block;font-size:10px;color:#ffd23f;letter-spacing:.1em;}
  #hudCoins{display:flex;align-items:center;gap:6px;} #coinIcon{width:16px;height:16px;image-rendering:pixelated;}

  #pmap{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 52px);height:16px;z-index:5;pointer-events:none;}
  #pmap.hidden{display:none;}
  #pmapTrack{position:absolute;left:0;right:0;top:5px;height:6px;background:#101828;border:2px solid #fff;}
  #pmapFill{position:absolute;left:2px;top:7px;height:4px;background:#ffd23f;width:0%;}
  .tick{position:absolute;top:0;width:12px;height:12px;margin-left:-6px;background:#101828;border:2px solid #fff;}
  .tick.done{background:#3ad44a;}
  #pmapHero{position:absolute;top:-6px;margin-left:-9px;width:18px;height:18px;image-rendering:pixelated;}

  #tapHint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);text-align:center;color:#fff;font-size:11px;text-shadow:2px 2px 0 #000;pointer-events:none;z-index:5;}
  #tapHint.hidden{display:none;}

  .ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;color:#fff;padding:18px;z-index:10;}
  .ov.hidden{display:none;} .scrim{position:absolute;inset:0;background:rgba(8,8,20,.82);}
  .panel{position:relative;background:#141a2e;border:4px solid #fff;box-shadow:6px 6px 0 #000;padding:18px 16px;max-width:520px;width:100%;}
  .panel h1{font-size:24px;font-weight:800;margin-bottom:6px;text-shadow:2px 2px 0 #000;letter-spacing:.02em;color:#ffd23f;}
  .panel p{font-size:12.5px;line-height:1.5;color:#cfd6ff;max-width:40ch;margin:0 auto;}
  .starrow{display:flex;gap:8px;justify-content:center;} .starrow canvas{width:36px;height:36px;image-rendering:pixelated;}
  .btn{border:none;background:#ffb020;color:#241000;border:3px solid #fff;box-shadow:3px 3px 0 #000;padding:12px 20px;font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;letter-spacing:.02em;}
  .btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000;}
  .btn.ghost{background:#2a3350;color:#fff;}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}

  #charRow{display:flex;gap:8px;justify-content:center;margin:4px 0;}
  .charBtn{background:#0e1424;border:3px solid #46507a;box-shadow:2px 2px 0 #000;padding:6px 6px 3px;cursor:pointer;width:64px;}
  .charBtn.on{border-color:#ffd23f;}
  .charBtn canvas{width:48px;height:44px;image-rendering:pixelated;display:block;margin:0 auto;}
  .charName{font-size:10px;color:#cfd6ff;text-align:center;margin-top:2px;}
  #mapCanvas{width:100%;height:auto;image-rendering:pixelated;margin:8px 0 4px;cursor:pointer;}
  .lvl-hint{font-size:11px;color:#8f9ac9;}

  #mathOverlay{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;pointer-events:none;z-index:12;}
  #mathOverlay.hidden{display:none;}
  #mathSheet{position:relative;pointer-events:auto;width:100%;max-width:440px;margin:0 8px calc(env(safe-area-inset-bottom,0px) + 12px);background:#141a2e;border:4px solid #fff;box-shadow:0 -6px 0 #000,6px 0 0 #000,-6px 0 0 #000;padding:14px 14px 16px;}
  #mathSheet .tag{position:absolute;top:-14px;left:50%;transform:translateX(-50%);background:#ff4fa3;color:#fff;border:3px solid #fff;font-size:10px;font-weight:800;letter-spacing:.06em;padding:4px 12px;white-space:nowrap;}
  #mq{text-align:center;font-size:34px;font-weight:800;color:#ffd23f;margin:10px 0 8px;text-shadow:2px 2px 0 #000;}
  #mabox{max-width:200px;margin:0 auto 8px;background:#0e1424;border:3px solid #46507a;padding:8px;text-align:center;}
  #mabox.good{border-color:#3ad44a;} #mabox.bad{border-color:#ff4f5a;animation:shk .3s;}
  @keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  #mdisp{font-size:32px;font-weight:800;color:#fff;letter-spacing:3px;} #mdisp.ph{color:#46507a;}
  .kpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:320px;margin:0 auto;}
  .key{border:none;background:#e8ecff;color:#141a2e;border:3px solid #fff;box-shadow:2px 2px 0 #000;padding:12px 0;font-family:inherit;font-size:22px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .key:active{transform:translate(2px,2px);box-shadow:0 0 0 #000;}
  .key.enter{background:#3ad44a;color:#06210a;} .key.del{background:#ff8ea0;} .key svg{width:24px;height:24px;}
</style>

<div id="game">
  <canvas id="c"></canvas>
  <div class="hud hidden" id="hud">
    <div class="box8" id="hudHearts"></div>
    <div class="box8 hmid"><span id="hudGate">GATE 1/4</span><small id="hudLevel">MEADOW</small></div>
    <div class="box8" id="hudCoins"><canvas id="coinIcon" width="8" height="8"></canvas><span id="coinN">0</span></div>
  </div>
  <div id="pmap" class="hidden"><div id="pmapTrack"></div><div id="pmapFill"></div><div id="pmapTicks"></div><canvas id="pmapHero" width="12" height="12"></canvas></div>
  <div id="tapHint" class="hidden">TAP = JUMP · HOLD = HIGHER · TAP AGAIN = DOUBLE</div>

  <div id="mathOverlay" class="hidden">
    <div id="mathSheet">
      <div class="tag">◆ GATE — SOLVE TO PASS ◆</div>
      <div id="mq">7 × 8</div>
      <div id="mabox"><span id="mdisp" class="ph">?</span></div>
      <div class="kpad" id="kpad">
        <button class="key" data-k="1">1</button><button class="key" data-k="2">2</button><button class="key" data-k="3">3</button>
        <button class="key" data-k="4">4</button><button class="key" data-k="5">5</button><button class="key" data-k="6">6</button>
        <button class="key" data-k="7">7</button><button class="key" data-k="8">8</button><button class="key" data-k="9">9</button>
        <button class="key del" data-k="del" aria-label="delete"><svg viewBox="0 0 24 24"><path d="M9 6h11v12H9l-6-6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 10l4 4M16 10l-4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
        <button class="key" data-k="0">0</button>
        <button class="key enter" data-k="enter" aria-label="enter"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
    </div>
  </div>

  <div id="mapOv" class="ov">
    <div class="scrim"></div>
    <div class="panel">
      <h1>★ QUEST LAND ★</h1>
      <p>Pick your hero, then a level. Beat one to unlock the next!</p>
      <div id="charRow"></div>
      <canvas id="mapCanvas" width="260" height="150"></canvas>
      <div class="lvl-hint">Locked levels open as you win.</div>
    </div>
  </div>

  <div id="winOv" class="ov hidden">
    <div class="scrim"></div>
    <div class="panel">
      <h1 id="winTitle">LEVEL CLEAR!</h1>
      <div class="starrow" id="winStars"></div>
      <p id="winMsg"></p>
      <div class="btnrow"><button class="btn" id="nextBtn">NEXT ➜</button><button class="btn ghost" id="mapBtn">MAP</button></div>
    </div>
  </div>
  <div id="failOv" class="ov hidden">
    <div class="scrim"></div>
    <div class="panel">
      <h1>GAME OVER</h1><p>Out of hearts — give it another go!</p>
      <div class="btnrow"><button class="btn" id="retryBtn">RETRY</button><button class="btn ghost" id="mapBtn2">MAP</button></div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var TEST=/[?&]test=1/.test(location.search);
  var cv=document.getElementById("c"), x=cv.getContext("2d");
  var WORLDH=760, LW=760, LH=760, GROUND=520, HEROX=150, sx=0.4, PIXW=140, PIXH=288;
  var HEROSIZE=96, MAXLEVELS=8, unlocked=1, HEROTYPE="unicorn";

  // pixel palettes per theme
  var THEMES=[
    {name:"MEADOW", prop:"tree",  sky:"#5c94fc",sky2:"#7fb0ff",cloud:"#ffffff",mtn:"#b8c8f0",mtnS:"#eef4ff",h1:"#57bf3a",h2:"#3a9e2a",grass:"#7cd04a",dirt:"#c9803f",dirtL:"#a8632f"},
    {name:"BEACH",  prop:"palm",  sky:"#67c8ff",sky2:"#a8e4ff",cloud:"#ffffff",mtn:"#cfe0f5",mtnS:"#ffffff",h1:"#ffe08a",h2:"#f0c860",grass:"#f2df9e",dirt:"#e0b060",dirtL:"#c99640",water:"#3fb0e0"},
    {name:"CANDY",  prop:"candy", sky:"#ff9ed6",sky2:"#ffc2e6",cloud:"#fff0f8",mtn:"#ffc2e2",mtnS:"#ffffff",h1:"#ff8ec8",h2:"#ef6aa8",grass:"#ffb0d8",dirt:"#e070a8",dirtL:"#c85890"},
    {name:"OCEAN",  prop:"coral", sky:"#39a8d8",sky2:"#7fd0ee",cloud:"#cfeeff",mtn:"#86dccf",mtnS:"#e0fffb",h1:"#3fbfb0",h2:"#2a9a8c",grass:"#57c8ba",dirt:"#2a8a7c",dirtL:"#1f6e62",water:"#2fb6d6"},
    {name:"SNOW",   prop:"pine",  sky:"#bcd7f2",sky2:"#dcecfb",cloud:"#ffffff",mtn:"#eaf4ff",mtnS:"#ffffff",h1:"#eef6ff",h2:"#d6e6f5",grass:"#f4faff",dirt:"#cfe0f0",dirtL:"#b0c8e0"},
    {name:"JUNGLE", prop:"jungle",sky:"#83d2a4",sky2:"#b0e8c4",cloud:"#d6f0d6",mtn:"#6fc06f",mtnS:"#bfeabf",h1:"#4aa84a",h2:"#357a35",grass:"#5abf5a",dirt:"#7a5a2a",dirtL:"#5a3f1a"},
    {name:"VOLCANO",prop:"rock",  sky:"#ff9a6b",sky2:"#ffc2a0",cloud:"#ffd0b0",mtn:"#b5745a",mtnS:"#ffb090",h1:"#8a5a4a",h2:"#6b4235",grass:"#9a5f48",dirt:"#6b4235",dirtL:"#4a2a1a",water:"#ff5a2a"},
    {name:"SPACE",  prop:"crystal",sky:"#180f38",sky2:"#2a1a5a",cloud:"#3a2f6e",mtn:"#3a2f6e",mtnS:"#6a5aa8",h1:"#4a3f7a",h2:"#352b5e",grass:"#5a4a9a",dirt:"#352b5e",dirtL:"#241a4a",night:true}
  ];
  // shared arcade object colors
  var C={coin:"#ffd23f",coinHi:"#fff2a8",coinLo:"#c9930a",box:"#ffb020",boxHi:"#ffd77a",boxLo:"#c97a00",enemy:"#8b6cf0",enemyD:"#5b3fc0",enemyEye:"#ffffff",enemyPup:"#241a4a",flag:"#ff4fa3",pole:"#dfe4ff",stone:"#9b8bbf",stoneD:"#6a5b9a",lock:"#ffd23f",star:"#ffe14a",castle:"#c8b7e6",castleD:"#9a86cf",door:"#3a2a6a"};

  function resize(){
    var w=window.innerWidth,h=window.innerHeight;WORLDH=760;LH=760;LW=Math.round(760*w/h);GROUND=Math.round(LH*0.70);HEROX=Math.round(LW*0.20);
    PIXH=300;PIXW=Math.max(120,Math.round(PIXH*w/h));sx=PIXH/LH;
    cv.width=PIXW;cv.height=PIXH;cv.style.width=w+"px";cv.style.height=h+"px";
    x.setTransform(1,0,0,1,0,0);x.imageSmoothingEnabled=false;
    if(G&&G.hero&&G.hero.ground)G.hero.y=GROUND;
  }
  window.addEventListener("resize",resize);

  function tablesFor(n){var t=[2,5,10];if(n>=2)t=t.concat([3,4]);if(n>=3)t=t.concat([6,7]);if(n>=4)t=t.concat([8,9]);if(n>=5)t=t.concat([11,12]);return t;}
  function config(n){return {gates:Math.min(4+(n-1),8),speed:210+(n-1)*20,tables:tablesFor(n),pit:150+(n-1)*22,enemySpeed:60+(n-1)*14,moving:n>=2,hearts:3};}

  var G, level=1;
  function reset(n){
    level=n;var cf=config(n);var th=THEMES[(n-1)%THEMES.length];
    G={cf:cf,theme:th,state:"run",cam:0,speed:cf.speed,t:0,hearts:cf.hearts,coins:0,nextGate:0,
      hero:{wx:HEROX,y:GROUND,vy:0,ground:true,hold:false,dbl:false,coyote:0,inv:0,power:0,run:0},
      question:null,input:"",lastCP:HEROX,particles:[],cloud:0,shakeT:0,dash:0,
      grounds:[],platforms:[],boxes:[],coinsA:[],enemies:[],flags:[],gates:[],star:null,castleX:0,props:[],flowers:[]};
    build(cf);buildPmap();
  }
  function build(cf){
    var SEG=1500,START=760,gx=[];for(var i=0;i<cf.gates;i++)gx.push(START+i*SEG);
    G.gates=gx.map(function(v){return {x:v,solved:false};});G.castleX=gx[gx.length-1]+SEG;
    var pits=[];for(var s=0;s<gx.length;s++){var base=gx[s]-SEG;if(base<200)continue;var pc=base+SEG*0.55;pits.push([pc,pc+cf.pit]);}
    var lastMid=gx[gx.length-1]+SEG*0.5;pits.push([lastMid,lastMid+cf.pit]);pits.sort(function(a,b){return a[0]-b[0];});
    var spans=[],cur=-400;pits.forEach(function(p){spans.push([cur,p[0]]);cur=p[1];});spans.push([cur,G.castleX+700]);G.grounds=spans;
    pits.forEach(function(p){var mid=(p[0]+p[1])/2;for(var k=-2;k<=2;k++)G.coinsA.push({x:mid+k*40,hAbove:160-Math.abs(k)*24,got:false});});
    for(var seg=0;seg<gx.length;seg++){var b=gx[seg]-SEG;if(b>200){
      for(var q=0;q<3;q++)G.boxes.push({x:b+300+q*60,hAbove:250,w:52,h:48,used:false});
      for(var c=0;c<4;c++)G.coinsA.push({x:b+540+c*48,hAbove:46,got:false});
      var mv=cf.moving&&seg%2===1;G.platforms.push({x:b+900,hAbove:210,w:160,mv:mv,amp:mv?90:0,period:2.2,phase:seg});
      for(var pc2=0;pc2<3;pc2++)G.coinsA.push({x:b+930+pc2*50,hAbove:262,got:false});
      G.enemies.push({x1:b+1060,x2:b+1260,x:b+1060,dir:1,alive:true});
    }}
    var mid2=Math.floor(gx.length/2);G.star={x:gx[mid2]-SEG*0.25,hAbove:160,taken:false};
    G.flags=[{x:HEROX,hit:true,raise:1}];for(var f=0;f<gx.length;f++){G.flags.push({x:gx[f]-SEG*0.5,hit:false,raise:0,half:true});}
    for(var tr=0;tr<90;tr++)G.props.push({x:tr*250+((tr*71)%160),s:52+((tr*53)%30)});
    for(var fl=0;fl<220;fl++)G.flowers.push({x:fl*84+((fl*37)%56),k:fl%3});
  }

  /* ---- audio ---- */
  var ac=null;function AC(){if(!ac){var A=window.AudioContext||window.webkitAudioContext;if(A)ac=new A();}return ac;}
  function tone(f,d,t,w,v){var a=AC();if(!a)return;var s=a.currentTime+(w||0),o=a.createOscillator(),g=a.createGain();o.type=t||"square";o.frequency.value=f;g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(v||.12,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g);g.connect(a.destination);o.start(s);o.stop(s+d+.02);}
  function sCoin(){tone(988,.06,"square",0,.09);tone(1319,.07,"square",.05,.08);}
  function sJump(){tone(392,.09,"square",0,.08);tone(587,.08,"square",.04,.07);}function sDbl(){tone(587,.09,"square",0,.07);}
  function sStomp(){tone(196,.09,"square",0,.11);}function sGood(){tone(523,.08,"square",0);tone(784,.12,"square",.08);}
  function sBad(){tone(147,.22,"square",0,.1);}function sHurt(){tone(110,.2,"sawtooth",0,.1);}
  function sStar(){[523,659,784,1046].forEach(function(f,i){tone(f,.1,"square",i*.05,.08);});}
  function sFlag(){tone(659,.08,"square",0);tone(988,.1,"square",.07);}function sWin(){[523,659,784,1046,1319].forEach(function(f,i){tone(f,.13,"square",i*.1);});}
  function haptic(m){if(navigator.vibrate){try{navigator.vibrate(m);}catch(e){}}}

  /* ---- input ---- */
  function jump(){if(G.state!=="run")return;var h=G.hero;if(h.ground||h.coyote>0){h.vy=-1020;h.ground=false;h.coyote=0;h.dbl=false;h.hold=true;sJump();}else if(!h.dbl){h.vy=-900;h.dbl=true;h.hold=true;sDbl();puff(h.wx,h.y-40);}}
  cv.addEventListener("pointerdown",function(){AC();jump();});
  cv.addEventListener("pointerup",function(){var h=G.hero;h.hold=false;if(h.vy<0)h.vy*=.5;});
  document.addEventListener("keydown",function(e){if(G.state==="gate"){if(e.key>="0"&&e.key<="9")key(e.key);else if(e.key==="Backspace")key("del");else if(e.key==="Enter")key("enter");}else if(e.key===" "||e.key==="ArrowUp"){e.preventDefault();jump();}});
  document.addEventListener("keyup",function(e){if(e.key===" "||e.key==="ArrowUp"){var h=G.hero;h.hold=false;if(h.vy<0)h.vy*=.5;}});
  document.getElementById("kpad").addEventListener("click",function(e){var b=e.target.closest(".key");if(b){AC();key(b.getAttribute("data-k"));}});
  function mdisp(){var d=document.getElementById("mdisp");if(G.input===""){d.textContent="?";d.classList.add("ph");}else{d.textContent=G.input;d.classList.remove("ph");}}
  function key(k){if(G.state!=="gate")return;if(k==="del"){G.input=G.input.slice(0,-1);mdisp();return;}if(k==="enter"){if(G.input!=="")submit(parseInt(G.input,10));return;}if(G.input.length>=3)return;if(G.input===""&&k==="0")return;G.input+=k;mdisp();if(parseInt(G.input,10)===G.question.a*G.question.b)submit(G.question.a*G.question.b);}
  function submit(v){var ans=G.question.a*G.question.b,box=document.getElementById("mabox");
    if(v===ans){box.className="good";sGood();haptic(12);G.gates[G.nextGate].solved=true;G.coins+=5;coinBurst(G.hero.wx,G.hero.y-50);
      setTimeout(function(){mathHide();box.className="";G.state="run";G.dash=.85;G.nextGate++;G.input="";hint(G.nextGate>=G.gates.length?"DASH TO THE CASTLE!":"NICE! KEEP GOING");},380);
    }else{G.hearts--;box.className="bad";sBad();haptic([10,40,10]);G.shakeT=.35;G.input="";mdisp();if(G.hearts<=0)setTimeout(function(){mathHide();G.state="fail";showOv("failOv");},420);}}

  function puff(wx,y){for(var i=0;i<7;i++)G.particles.push({wx:wx,y:y,vx:(Math.random()*2-1)*90,vy:-(Math.random()*130+40),life:.5,kind:"puff"});}
  function coinBurst(wx,y){for(var i=0;i<9;i++)G.particles.push({wx:wx,y:y,vx:(Math.random()*2-.4)*160,vy:-(Math.random()*260+120),life:.9,kind:"coin"});}
  function sparkle(wx,y){for(var i=0;i<2;i++)G.particles.push({wx:wx+(Math.random()*50-25),y:y-Math.random()*40,vx:(Math.random()*2-1)*40,vy:-(Math.random()*60+20),life:.5,kind:"star"});}
  function groundAt(wx){for(var i=0;i<G.grounds.length;i++){var s=G.grounds[i];if(wx>=s[0]&&wx<=s[1])return true;}return false;}
  function platTop(p){var ha=p.mv?p.hAbove+Math.sin(G.t*2*Math.PI/p.period+p.phase)*p.amp:p.hAbove;return GROUND-ha;}
  function pickQ(){var T=G.cf.tables;return {a:T[Math.floor(Math.random()*T.length)],b:1+Math.floor(Math.random()*12)};}

  function hideAllOv(){["mapOv","winOv","failOv"].forEach(function(id){document.getElementById(id).classList.add("hidden");});}
  function showOv(id){document.getElementById(id).classList.remove("hidden");hudShow(false);}
  function hudShow(v){document.getElementById("hud").classList.toggle("hidden",!v);document.getElementById("pmap").classList.toggle("hidden",!v);document.getElementById("tapHint").classList.toggle("hidden",!v);}
  function mathShow(){document.getElementById("mathOverlay").classList.remove("hidden");}
  function mathHide(){document.getElementById("mathOverlay").classList.add("hidden");}
  function hint(t){var el=document.getElementById("tapHint");el.textContent=t;el.classList.toggle("hidden",!t);}

  var last=0;
  function frame(ts){var dt=Math.min(.045,(ts-(last||ts))/1000);last=ts;if(G){G.cloud+=dt*14;G.t+=dt;var h=G.hero;
    if(G.state==="run"){
      var sp=G.speed*(1+G.dash);G.dash=Math.max(0,G.dash-dt*1.6);h.wx+=sp*dt;h.run+=dt*sp*.03;
      var g=(h.hold&&h.vy<0)?1500:2700;h.vy+=g*dt;
      if(h.coyote>0)h.coyote-=dt;if(h.inv>0)h.inv-=dt;if(h.power>0)h.power=Math.max(0,h.power-dt);
      var ny=h.y+h.vy*dt,landTop=null;
      for(var i=0;i<G.platforms.length;i++){var p=G.platforms[i];var top=platTop(p);if(h.wx>=p.x&&h.wx<=p.x+p.w&&h.vy>=0&&h.y<=top+4&&ny>=top){if(landTop===null||top<landTop)landTop=top;}}
      if(landTop===null){if((groundAt(h.wx)||TEST)&&h.vy>=0&&ny>=GROUND&&h.y<=GROUND+4)landTop=GROUND;}
      if(landTop!==null){h.y=landTop;h.vy=0;h.ground=true;h.dbl=false;h.coyote=.1;}else{if(h.ground)h.coyote=.1;h.ground=false;h.y=ny;}
      var headY=h.y-HEROSIZE*0.9;
      for(var b=0;b<G.boxes.length;b++){var bx=G.boxes[b];if(bx.used)continue;var by=GROUND-bx.hAbove;if(h.vy<0&&h.wx>=bx.x-8&&h.wx<=bx.x+bx.w+8&&headY<=by+bx.h&&headY>=by-12){bx.used=true;bx.pop=.2;h.vy=80;G.coins++;sCoin();G.particles.push({wx:bx.x+bx.w/2,y:by-14,vx:0,vy:-220,life:.7,kind:"coin"});}}
      if(G.star&&!G.star.taken){var syv=GROUND-G.star.hAbove;if(Math.abs(G.star.x-h.wx)<50&&Math.abs(syv-(h.y-40))<66){G.star.taken=true;h.power=6.5;sStar();haptic([12,30,12]);}}
      for(var k=0;k<G.coinsA.length;k++){var co=G.coinsA[k];if(co.got)continue;var cy=GROUND-co.hAbove;var dx=co.x-h.wx,dy=cy-(h.y-40);if(h.power>0&&Math.abs(dx)<300&&Math.abs(dy)<300){co.x-=dx*Math.min(1,dt*9);co.hAbove+=dy*Math.min(1,dt*9);}if(Math.abs(co.x-h.wx)<38&&Math.abs((GROUND-co.hAbove)-(h.y-40))<54){co.got=true;G.coins++;sCoin();}}
      for(var e=0;e<G.enemies.length;e++){var en=G.enemies[e];if(!en.alive)continue;en.x+=en.dir*G.cf.enemySpeed*dt;if(en.x<en.x1){en.x=en.x1;en.dir=1;}if(en.x>en.x2){en.x=en.x2;en.dir=-1;}var eTop=GROUND-52;if(Math.abs(en.x-h.wx)<40){if(h.power>0){en.alive=false;G.coins+=3;sStomp();coinBurst(en.x,eTop);}else if(h.vy>0&&h.y<=eTop+22&&h.y>=eTop-40){en.alive=false;h.vy=-620;G.coins+=3;sStomp();haptic(15);coinBurst(en.x,eTop);}else if(!TEST&&h.inv<=0&&h.y>eTop-28){hurt();}}}
      for(var f=0;f<G.flags.length;f++){var fl=G.flags[f];if(!fl.hit&&h.wx>=fl.x){fl.hit=true;G.lastCP=fl.x;sFlag();}}
      if(h.y>GROUND+420){respawn();}
      if(G.nextGate<G.gates.length){var ga=G.gates[G.nextGate];if(!ga.solved&&h.wx>=ga.x-52){h.wx=ga.x-52;arrive();}}else if(h.wx>=G.castleX-80){win();}
      if(h.power>0&&Math.random()<.5)sparkle(h.wx,h.y-HEROSIZE*0.4);
    }

    for(var p2=G.particles.length-1;p2>=0;p2--){var pt=G.particles[p2];pt.wx+=pt.vx*dt;pt.vy+=1600*dt;pt.y+=pt.vy*dt;pt.life-=dt*1.1;if(pt.life<=0)G.particles.splice(p2,1);}

    // water/lava in pits

    // props

    // platforms

    // boxes
    for(var b=0;b<G.boxes.length;b++){var bx=G.boxes[b];var bxs=FX(bx.x),bpop=bx.pop?SZ(bx.pop*36):0;if(bxs>W+8||bxs<-8)continue;pxBox(bxs,FY(GROUND-bx.hAbove)-bpop,SZ(bx.w),SZ(bx.h),bx.used);if(bx.pop)bx.pop=Math.max(0,bx.pop-.03);}
    // flags

    // enemies

    // flowers

  function pcanv(id,drawFn,w,h){var cc=document.getElementById(id);cc.width=w;cc.height=h;var g=cc.getContext("2d");g.imageSmoothingEnabled=false;g.clearRect(0,0,w,h);drawFn(g);}
  function heartPix(g,on){var m=on?"#ff5c6c":"#3a3f5a";g.fillStyle=m;[[1,1],[2,1],[4,1],[5,1],[0,2],[1,2],[2,2],[3,2],[4,2],[5,2],[6,2],[0,3],[1,3],[2,3],[3,3],[4,3],[5,3],[6,3],[1,4],[2,4],[3,4],[4,4],[5,4],[2,5],[3,5],[4,5],[3,6]].forEach(function(p){g.fillRect(p[0],p[1],1,1);});if(on){g.fillStyle="#ffd0d6";g.fillRect(1,2,1,1);g.fillRect(2,2,1,1);}}
  function coinPix(g){g.fillStyle=C.coin;g.fillRect(1,1,6,6);g.fillStyle=C.coinHi;g.fillRect(1,1,6,2);g.fillStyle=C.coinLo;g.fillRect(3,2,2,4);}
  function heroMarkPix(g){hbx.clearRect(0,0,14,12);var H=HERO_MAP[HEROTYPE]||HERO_MAP.unicorn;spr(hbx,0,0,H.rows,H.map);g.drawImage(heroBuf,0,0,14,12,0,0,12,12);}
  document.getElementById("coinIcon").width=8;document.getElementById("coinIcon").height=8;
  (function(){var g=document.getElementById("coinIcon").getContext("2d");g.imageSmoothingEnabled=false;coinPix(g);})();
  function starPix(g,on){var c=on?C.star:"#3a3f5a";g.fillStyle=c;[[8,1],[7,5],[9,5],[3,6],[13,6],[6,8],[10,8],[5,12],[11,12]].forEach(function(){});
    // simple 5-point via blocks
    g.fillRect(7,1,2,4);g.fillRect(3,5,10,2);g.fillRect(5,7,6,3);g.fillRect(4,10,3,3);g.fillRect(9,10,3,3);}
  function drawStarRow(el,n){el.innerHTML="";for(var i=0;i<3;i++){var c=document.createElement("canvas");c.width=16;c.height=16;var g=c.getContext("2d");g.imageSmoothingEnabled=false;starPix(g,i<n);el.appendChild(c);}}
  function buildPmap(){var ticks=document.getElementById("pmapTicks");ticks.innerHTML="";var total=G.castleX;G.gates.forEach(function(ga){var d=document.createElement("div");d.className="tick";d.style.left=(ga.x/total*100)+"%";ticks.appendChild(d);});var cf=document.createElement("div");cf.className="tick";cf.style.left="100%";cf.style.borderColor="#ffd23f";ticks.appendChild(cf);}
  function hudUpdate(){if(!G)return;var el=document.getElementById("hudHearts");if(!el._n||el._n!==G.hearts){el._n=G.hearts;el.innerHTML="";for(var i=0;i<3;i++){var c=document.createElement("canvas");c.width=8;c.height=7;var g=c.getContext("2d");g.imageSmoothingEnabled=false;heartPix(g,i<G.hearts);el.appendChild(c);}}
    document.getElementById("coinN").textContent=G.coins;document.getElementById("hudGate").textContent="GATE "+Math.min(G.nextGate+1,G.gates.length)+"/"+G.gates.length;document.getElementById("hudLevel").textContent=G.theme.name;
    var prog=Math.max(0,Math.min(1,G.hero.wx/G.castleX));document.getElementById("pmapFill").style.width=(prog*98)+"%";document.getElementById("pmapHero").style.left=(prog*100)+"%";var tk=document.getElementById("pmapTicks").children;for(var t=0;t<G.gates.length;t++)tk[t].classList.toggle("done",G.gates[t].solved);}
  (function(){var g=document.getElementById("pmapHero").getContext("2d");g.imageSmoothingEnabled=false;heroMarkPix(g);})();

  /* ---- level map (pixel canvas) ---- */
  var mcv=document.getElementById("mapCanvas"), mg=mcv.getContext("2d"), mapNodes=[];
  function buildMap(){
    var W=260,H=150;mcv.width=W;mcv.height=H;mg.imageSmoothingEnabled=false;mg.clearRect(0,0,W,H);
    var pad=30,cols=4,rows=Math.ceil(MAXLEVELS/cols);mapNodes=[];
    for(var i=0;i<MAXLEVELS;i++){var row=Math.floor(i/cols),col=i%cols;if(row%2)col=cols-1-col;var xx=pad+col*((W-2*pad)/(cols-1));var yy=pad+row*((H-2*pad)/(rows-1||1));mapNodes.push({x:Math.round(xx),y:Math.round(yy),n:i+1,theme:THEMES[i%THEMES.length]});}
    // dotted path
    mg.fillStyle="rgba(255,255,255,.35)";for(var p=0;p<mapNodes.length-1;p++){var A=mapNodes[p],Bn=mapNodes[p+1];for(var t=0;t<1;t+=0.06){mg.fillRect(Math.round(A.x+(Bn.x-A.x)*t),Math.round(A.y+(Bn.y-A.y)*t),2,2);}}
    mapNodes.forEach(function(p){var open=p.n<=unlocked,R=16;
      var sg=mg;sg.save();sg.beginPath();sg.rect(p.x-R,p.y-R,R*2,R*2);sg.clip();
      // badge bg = theme sky + grass (always themed so you can recognise the world)
      mg.fillStyle=p.theme.sky;mg.fillRect(p.x-R,p.y-R,R*2,R*2);
      mg.fillStyle=p.theme.sky2||p.theme.sky;mg.fillRect(p.x-R,p.y,R*2,R);
      mg.fillStyle=p.theme.grass;mg.fillRect(p.x-R,p.y+R-6,R*2,6);
      // themed mini icon (palm=beach, tree=meadow, candy=candy, etc.)
      var save=x;x=mg;pxProp(p.theme.prop,p.x,p.y+R-6,20,p.theme);x=save;
      // grey wash for locked worlds
      if(!open){mg.fillStyle="rgba(20,24,40,.62)";mg.fillRect(p.x-R,p.y-R,R*2,R*2);}
      sg.restore();
      // border
      mg.fillStyle=open?"#fff":"#5a5f7a";mg.fillRect(p.x-R,p.y-R,R*2,2);mg.fillRect(p.x-R,p.y+R-2,R*2,2);mg.fillRect(p.x-R,p.y-R,2,R*2);mg.fillRect(p.x+R-2,p.y-R,2,R*2);
      // corner lock (small, bottom-left) so the theme art stays visible
      if(!open){mg.fillStyle="#101828";mg.fillRect(p.x-R+2,p.y+R-11,11,9);mg.fillStyle="#ffd23f";mg.fillRect(p.x-R+4,p.y+R-9,7,5);mg.fillStyle="#101828";mg.fillRect(p.x-R+6,p.y+R-15,3,5);mg.fillRect(p.x-R+6,p.y+R-7,3,3);}
      // number
      mg.fillStyle=(p.n===level?"#ff4fa3":"#ffd23f");mg.fillRect(p.x+R-8,p.y-R-2,12,12);mg.fillStyle="#101828";mg.font="900 10px monospace";mg.textAlign="center";mg.textBaseline="middle";mg.fillText(p.n,p.x+R-2,p.y-R+5);
      // label
      mg.fillStyle=open?"#fff":"#8f9ac9";mg.font="700 8px monospace";mg.fillText(p.theme.name,p.x,p.y+R+8);
    });
  }
  function pxPropMap(type,cx,gY,s,th){var oldx=x;x=mg;pxProp(type,cx,gY,s,th);x=oldx;}
  mcv.addEventListener("click",function(ev){var rect=mcv.getBoundingClientRect(),scale=260/rect.width;var mxp=(ev.clientX-rect.left)*scale,myp=(ev.clientY-rect.top)*scale;for(var i=0;i<mapNodes.length;i++){var p=mapNodes[i];if(p.n<=unlocked&&Math.abs(mxp-p.x)<20&&Math.abs(myp-p.y)<20){AC();startLevel(p.n);return;}}});

  var CHARS=[{id:"unicorn",name:"LUNA"},{id:"cat",name:"PIXEL"},{id:"fox",name:"RUSTY"}];
  function buildCharRow(){var row=document.getElementById("charRow");row.innerHTML="";CHARS.forEach(function(ch){var btn=document.createElement("button");btn.className="charBtn"+(ch.id===HEROTYPE?" on":"");var c=document.createElement("canvas");c.width=42;c.height=36;var g=c.getContext("2d");g.imageSmoothingEnabled=false;hbx.clearRect(0,0,14,12);spr(hbx,0,0,HERO_MAP[ch.id].rows,HERO_MAP[ch.id].map);g.drawImage(heroBuf,0,0,14,12,0,0,42,36);var nm=document.createElement("div");nm.className="charName";nm.textContent=ch.name;btn.appendChild(c);btn.appendChild(nm);btn.addEventListener("click",function(){HEROTYPE=ch.id;buildCharRow();var pg=document.getElementById("pmapHero").getContext("2d");pg.imageSmoothingEnabled=false;pg.clearRect(0,0,12,12);heroMarkPix(pg);});row.appendChild(btn);});}

  document.getElementById("nextBtn").addEventListener("click",function(){startLevel(Math.min(level+1,MAXLEVELS));});

  document.getElementById("mapBtn2").addEventListener("click",function(){hideAllOv();buildMap();showOv("mapOv");});
  window.__proto={get state(){return G?G.state:null;},get q(){return G?G.question:null;},get hearts(){return G?G.hearts:null;},get coins(){return G?G.coins:null;},get gate(){return G?G.nextGate:null;},get total(){return G?G.gates.length:null;},get level(){return level;},start:function(n){startLevel(n||1);}};

  resize();reset(1);G.state="map";buildCharRow();buildMap();hudShow(false);requestAnimationFrame(frame);
})();
