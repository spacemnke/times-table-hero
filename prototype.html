<meta charset="utf-8" />
<title>Quest Land — Prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#7ec8ff" />
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;}
  html,body{height:100%;overflow:hidden;background:#0b1020;font-family:ui-rounded,"SF Pro Rounded","Nunito",system-ui,sans-serif;-webkit-user-select:none;user-select:none;}
  #game{position:fixed;inset:0;}
  canvas{display:block;touch-action:none;}
  #c{width:100%;height:100%;}

  #hud{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;right:12px;display:flex;align-items:center;justify-content:space-between;pointer-events:none;font-weight:900;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.4);z-index:5;}
  #hud.hidden{display:none;}
  .pill{background:rgba(20,14,45,.34);backdrop-filter:blur(6px);border-radius:999px;padding:6px 12px;display:flex;align-items:center;gap:6px;font-size:16px;}
  .pill.mid{flex-direction:column;gap:0;line-height:1.05;text-align:center;}
  .pill.mid small{font-weight:800;opacity:.9;font-size:11px;letter-spacing:.05em;text-transform:uppercase;}
  #hudHearts{display:flex;gap:3px;} #hudHearts svg{width:22px;height:22px;} .ic{width:20px;height:20px;vertical-align:-4px;}

  #pmap{position:absolute;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 52px);height:20px;pointer-events:none;z-index:5;}
  #pmap.hidden{display:none;}
  #pmapTrack{position:absolute;left:0;right:0;top:7px;height:6px;border-radius:999px;background:rgba(20,14,45,.3);}
  #pmapFill{position:absolute;left:0;top:7px;height:6px;border-radius:999px;background:linear-gradient(90deg,#7be0ff,#b7ff8a);width:0%;}
  .tick{position:absolute;top:1px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#fff;border:3px solid #8b78c9;box-shadow:0 1px 3px rgba(0,0,0,.3);}
  .tick.done{border-color:#27c96a;background:#d8ffe6;}
  #pmapHero{position:absolute;top:-9px;margin-left:-11px;width:22px;height:22px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));}

  #tapHint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);text-align:center;color:#fff;font-weight:800;font-size:13px;text-shadow:0 2px 8px rgba(0,0,0,.5);pointer-events:none;opacity:.9;transition:opacity .3s;z-index:5;}
  #tapHint.hidden{opacity:0;}

  .ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;color:#fff;padding:22px;z-index:10;}
  .ov.hidden{display:none;}
  .scrim{position:absolute;inset:0;background:radial-gradient(120% 100% at 50% 55%,rgba(24,16,52,.42),rgba(10,7,26,.84));}
  .card{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.15),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(10px);border-radius:26px;padding:22px 20px;max-width:520px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.5);}
  .card h1{font-size:30px;font-weight:900;margin-bottom:4px;}
  .card p{font-weight:700;opacity:.95;max-width:34ch;margin:0 auto;font-size:15px;}
  .starrow{display:flex;gap:6px;justify-content:center;} .starrow svg{width:44px;height:44px;}
  .btn{border:none;border-radius:16px;padding:14px 22px;font-size:17px;font-weight:900;cursor:pointer;color:#fff;background:linear-gradient(120deg,#6a41ff,#ff3d81);box-shadow:0 10px 24px rgba(106,65,255,.5);}
  .btn.ghost{background:rgba(255,255,255,.16);box-shadow:none;}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}

  #mapOv h1{background:linear-gradient(120deg,#ffd15c,#ff6ea9,#8f7bff);-webkit-background-clip:text;background-clip:text;color:transparent;}
  #charRow{display:flex;gap:10px;justify-content:center;margin:6px 0 2px;}
  .charBtn{border:none;background:rgba(255,255,255,.12);border:2px solid transparent;border-radius:16px;padding:6px;cursor:pointer;width:66px;height:66px;}
  .charBtn.on{border-color:#fff;background:rgba(255,255,255,.22);}
  .charBtn canvas{width:54px;height:54px;}
  .charName{font-size:12px;font-weight:800;opacity:.9;margin-top:-2px;}
  #mapCanvas{width:100%;height:auto;display:block;margin:8px 0 2px;cursor:pointer;}
  .lvl-hint{font-size:13px;opacity:.85;font-weight:700;}

  #mathOverlay{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;pointer-events:none;z-index:12;}
  #mathOverlay.hidden{display:none;}
  #mathOverlay .mscrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,6,26,0) 30%,rgba(10,6,26,.5) 100%);}
  #mathSheet{position:relative;pointer-events:auto;width:100%;max-width:460px;margin:0 10px calc(env(safe-area-inset-bottom,0px) + 14px);background:linear-gradient(180deg,#ffffff,#f3efff);border-radius:26px 26px 22px 22px;box-shadow:0 -8px 40px rgba(20,10,60,.5);padding:16px 16px 18px;animation:rise .28s cubic-bezier(.2,1,.3,1);}
  @keyframes rise{from{transform:translateY(120%);}to{transform:translateY(0);}}
  #mathSheet .tag{position:absolute;top:-15px;left:50%;transform:translateX(-50%);background:linear-gradient(120deg,#6a41ff,#ff3d81);color:#fff;font-weight:900;font-size:12px;letter-spacing:.05em;text-transform:uppercase;padding:6px 14px;border-radius:999px;box-shadow:0 6px 16px rgba(106,65,255,.5);white-space:nowrap;}
  #mq{text-align:center;font-size:42px;font-weight:900;color:#241a4a;margin:10px 0 8px;}
  #mabox{max-width:220px;margin:0 auto 8px;background:#f0ecff;border:3px solid transparent;border-radius:16px;padding:8px;text-align:center;}
  #mabox.good{border-color:#24b866;} #mabox.bad{border-color:#ff5c6c;animation:shk .35s;}
  @keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  #mdisp{font-size:38px;font-weight:900;color:#5b3df0;letter-spacing:2px;} #mdisp.ph{color:#9b93c9;opacity:.6;}
  .kpad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:340px;margin:0 auto;}
  .key{border:none;border-radius:16px;padding:14px 0;font-size:26px;font-weight:800;background:#fff;color:#241a4a;cursor:pointer;box-shadow:0 4px 0 #e3ddf5;display:flex;align-items:center;justify-content:center;}
  .key:active{transform:translateY(3px);box-shadow:none;}
  .key.enter{background:linear-gradient(120deg,#6a41ff,#ff3d81);color:#fff;box-shadow:0 4px 0 #4a2ec4;} .key.del{color:#8b83b5;} .key svg{width:26px;height:26px;}
</style>

<div id="game">
  <canvas id="c"></canvas>
  <div id="hud" class="hidden">
    <div class="pill" id="hudHearts"></div>
    <div class="pill mid"><span id="hudGate">Gate 1/4</span><small id="hudLevel">Level 1</small></div>
    <div class="pill" id="hudCoins"><span id="coinIcon"></span><span id="coinN">0</span></div>
  </div>
  <div id="pmap" class="hidden"><div id="pmapTrack"></div><div id="pmapFill"></div><div id="pmapTicks"></div><div id="pmapHero"></div></div>
  <div id="tapHint" class="hidden">Tap to jump · hold higher · tap again = double-jump</div>

  <div id="mathOverlay" class="hidden">
    <div class="mscrim"></div>
    <div id="mathSheet">
      <div class="tag">Gate — solve to pass!</div>
      <div id="mq">7 × 8</div>
      <div id="mabox"><span id="mdisp" class="ph">?</span></div>
      <div class="kpad" id="kpad">
        <button class="key" data-k="1">1</button><button class="key" data-k="2">2</button><button class="key" data-k="3">3</button>
        <button class="key" data-k="4">4</button><button class="key" data-k="5">5</button><button class="key" data-k="6">6</button>
        <button class="key" data-k="7">7</button><button class="key" data-k="8">8</button><button class="key" data-k="9">9</button>
        <button class="key del" data-k="del" aria-label="delete"><svg viewBox="0 0 24 24"><path d="M9 6h11v12H9l-6-6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 10l4 4M16 10l-4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
        <button class="key" data-k="0">0</button>
        <button class="key enter" data-k="enter" aria-label="enter"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
    </div>
  </div>

  <div id="mapOv" class="ov">
    <div class="scrim"></div>
    <div class="card">
      <h1>Quest Land</h1>
      <p>Pick your hero, then choose a level. Beat one to unlock the next!</p>
      <div id="charRow"></div>
      <canvas id="mapCanvas" width="520" height="300"></canvas>
      <div class="lvl-hint">Locked levels open as you win.</div>
    </div>
  </div>

  <div id="winOv" class="ov hidden">
    <div class="scrim"></div>
    <div class="card">
      <h1 id="winTitle">Level complete!</h1>
      <div class="starrow" id="winStars"></div>
      <p id="winMsg"></p>
      <div class="btnrow"><button class="btn" id="nextBtn">Next level ➜</button><button class="btn ghost" id="mapBtn">Level map</button></div>
    </div>
  </div>
  <div id="failOv" class="ov hidden">
    <div class="scrim"></div>
    <div class="card">
      <h1>Out of hearts!</h1><p>Give the level another go — you've got this!</p>
      <div class="btnrow"><button class="btn" id="retryBtn">Try again</button><button class="btn ghost" id="mapBtn2">Level map</button></div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var TEST=/[?&]test=1/.test(location.search);
  var cv=document.getElementById("c"), x=cv.getContext("2d");
  var WORLDH=760, LW=760, LH=760, DPR=1, GROUND=520, HEROX=150, skyGrad=null;
  var HEROSIZE=90, MAXLEVELS=8, unlocked=1, HEROTYPE="unicorn";

  var THEMES=[
    {name:"Meadow", icon:"meadow", sky:["#5db4ff","#eaf8ff"], gr:"#7cc659", grD:"#5aa63f", h1:"#a9dd86", h2:"#8fd06a", prop:"tree", soft:"#dff5c8"},
    {name:"Beach",  icon:"beach",  sky:["#67c8ff","#fff3d6"], gr:"#f2df9e", grD:"#e3c877", h1:"#ffe9a8", h2:"#ffdd8c", prop:"palm", soft:"#fff0c8", water:"#4fc3e8"},
    {name:"Candy",  icon:"candy",  sky:["#ff9ed6","#fff0f8"], gr:"#ff9ec7", grD:"#ef6aa0", h1:"#ffc2e2", h2:"#ffa8d2", prop:"candy", soft:"#ffdcf0"},
    {name:"Ocean",  icon:"ocean",  sky:["#39a8d8","#c6efff"], gr:"#42c0b0", grD:"#2a9a8c", h1:"#86dccf", h2:"#5ac8ba", prop:"coral", soft:"#c9f4ee", water:"#2fb6d6"},
    {name:"Snow",   icon:"snow",   sky:["#bcd7f2","#ffffff"], gr:"#eef6ff", grD:"#cfe2f5", h1:"#f4faff", h2:"#dcebfb", prop:"pine", soft:"#eaf4ff"},
    {name:"Jungle", icon:"jungle", sky:["#83d2a4","#e9ffe9"], gr:"#4aa84a", grD:"#357a35", h1:"#6fc06f", h2:"#54a854", prop:"jungle", soft:"#cdeecd"},
    {name:"Volcano",icon:"volcano",sky:["#ff9a6b","#ffe2c6"], gr:"#8a5a4a", grD:"#6b4235", h1:"#b5745a", h2:"#9a5f48", prop:"rock", soft:"#ffd8c2", water:"#ff5a2a"},
    {name:"Space",  icon:"space",  sky:["#2c2064","#6a4ab8"], gr:"#4a3f7a", grD:"#352b5e", h1:"#6a5aa8", h2:"#54479a", prop:"crystal", soft:"#d6c8ff", night:true}
  ];

  function makeSky(th){var g=x.createLinearGradient(0,0,0,LH);g.addColorStop(0,th.sky[0]);g.addColorStop(1,th.sky[1]);return g;}
  function resize(){
    DPR=Math.min(2.5,window.devicePixelRatio||1);var w=window.innerWidth,h=window.innerHeight;
    LH=WORLDH;LW=Math.round(WORLDH*w/h);GROUND=Math.round(LH*0.70);HEROX=Math.round(LW*0.20);
    cv.width=Math.round(w*DPR);cv.height=Math.round(h*DPR);cv.style.width=w+"px";cv.style.height=h+"px";
    x.setTransform((w*DPR)/LW,0,0,(w*DPR)/LW,0,0);
    skyGrad=makeSky(G&&G.theme?G.theme:THEMES[0]);
    if(G&&G.hero&&G.hero.ground)G.hero.y=GROUND;
  }
  window.addEventListener("resize",resize);

  function tablesFor(n){var t=[2,5,10];if(n>=2)t=t.concat([3,4]);if(n>=3)t=t.concat([6,7]);if(n>=4)t=t.concat([8,9]);if(n>=5)t=t.concat([11,12]);return t;}
  function config(n){return {gates:Math.min(4+(n-1),8),speed:210+(n-1)*20,tables:tablesFor(n),pit:150+(n-1)*22,enemySpeed:60+(n-1)*14,moving:n>=2,hearts:3};}

  var G, level=1;
  function reset(n){
    level=n;var cf=config(n);var th=THEMES[(n-1)%THEMES.length];
    G={cf:cf,theme:th,state:"run",cam:0,speed:cf.speed,t:0,hearts:cf.hearts,coins:0,nextGate:0,
      hero:{wx:HEROX,y:GROUND,vy:0,ground:true,hold:false,dbl:false,coyote:0,inv:0,power:0,run:0},
      question:null,input:"",lastCP:HEROX,particles:[],cloud:0,shakeT:0,dash:0,
      grounds:[],platforms:[],boxes:[],coinsA:[],enemies:[],flags:[],gates:[],star:null,castleX:0,props:[],flowers:[]};
    skyGrad=makeSky(th);build(cf);buildPmap();
  }
  function build(cf){
    var SEG=1500,START=760,gx=[];for(var i=0;i<cf.gates;i++)gx.push(START+i*SEG);
    G.gates=gx.map(function(v){return {x:v,solved:false};});G.castleX=gx[gx.length-1]+SEG;
    var pits=[];for(var s=0;s<gx.length;s++){var base=gx[s]-SEG;if(base<200)continue;var pc=base+SEG*0.55;pits.push([pc,pc+cf.pit]);}
    var lastMid=gx[gx.length-1]+SEG*0.5;pits.push([lastMid,lastMid+cf.pit]);pits.sort(function(a,b){return a[0]-b[0];});
    var spans=[],cur=-400;pits.forEach(function(p){spans.push([cur,p[0]]);cur=p[1];});spans.push([cur,G.castleX+700]);G.grounds=spans;
    pits.forEach(function(p){var mid=(p[0]+p[1])/2;for(var k=-2;k<=2;k++)G.coinsA.push({x:mid+k*40,hAbove:160-Math.abs(k)*24,got:false});});
    for(var seg=0;seg<gx.length;seg++){var b=gx[seg]-SEG;if(b>200){
      for(var q=0;q<3;q++)G.boxes.push({x:b+300+q*60,hAbove:250,w:52,h:48,used:false});
      for(var c=0;c<4;c++)G.coinsA.push({x:b+540+c*48,hAbove:46,got:false});
      var mv=cf.moving&&seg%2===1;G.platforms.push({x:b+900,hAbove:210,w:160,mv:mv,amp:mv?90:0,period:2.2,phase:seg});
      for(var pc2=0;pc2<3;pc2++)G.coinsA.push({x:b+930+pc2*50,hAbove:262,got:false});
      G.enemies.push({x1:b+1060,x2:b+1260,x:b+1060,dir:1,alive:true});
    }}
    var mid2=Math.floor(gx.length/2);G.star={x:gx[mid2]-SEG*0.25,hAbove:160,taken:false};
    // halfway checkpoints: one at the middle of each gate segment
    G.flags=[{x:HEROX,hit:true,raise:1}];for(var f=0;f<gx.length;f++){G.flags.push({x:gx[f]-SEG*0.5,hit:false,raise:0,half:true});}
    for(var tr=0;tr<90;tr++)G.props.push({x:tr*250+((tr*71)%160),s:52+((tr*53)%30)});
    for(var fl=0;fl<220;fl++)G.flowers.push({x:fl*84+((fl*37)%56),k:fl%3});
  }

  /* ---- audio ---- */
  var ac=null;function AC(){if(!ac){var A=window.AudioContext||window.webkitAudioContext;if(A)ac=new A();}return ac;}
  function tone(f,d,t,w,v){var a=AC();if(!a)return;var s=a.currentTime+(w||0),o=a.createOscillator(),g=a.createGain();o.type=t||"sine";o.frequency.value=f;g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(v||.13,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g);g.connect(a.destination);o.start(s);o.stop(s+d+.02);}
  function sCoin(){tone(880,.07,"triangle",0,.09);tone(1320,.07,"triangle",.04,.08);}
  function sJump(){tone(520,.09,"square",0,.07);}function sDbl(){tone(720,.09,"square",0,.07);}
  function sStomp(){tone(300,.08,"square",0,.11);tone(600,.1,"triangle",.06,.09);}
  function sGood(){tone(660,.1,"sine",0);tone(990,.14,"sine",.09);}function sBad(){tone(180,.22,"sine",0);}
  function sHurt(){tone(200,.2,"sawtooth",0,.11);}function sStar(){[660,880,1100,1320].forEach(function(f,i){tone(f,.12,"triangle",i*.06,.09);});}
  function sFlag(){tone(700,.1,"sine",0);tone(1050,.12,"sine",.08);}function sWin(){[523,659,784,1046].forEach(function(f,i){tone(f,.16,"sine",i*.11);});}
  function haptic(m){if(navigator.vibrate){try{navigator.vibrate(m);}catch(e){}}}

  /* ---- input ---- */
  function jump(){if(G.state!=="run")return;var h=G.hero;if(h.ground||h.coyote>0){h.vy=-1020;h.ground=false;h.coyote=0;h.dbl=false;h.hold=true;sJump();}else if(!h.dbl){h.vy=-900;h.dbl=true;h.hold=true;sDbl();puff(h.wx,h.y-40);}}
  cv.addEventListener("pointerdown",function(){AC();jump();});
  cv.addEventListener("pointerup",function(){var h=G.hero;h.hold=false;if(h.vy<0)h.vy*=.5;});
  document.addEventListener("keydown",function(e){if(G.state==="gate"){if(e.key>="0"&&e.key<="9")key(e.key);else if(e.key==="Backspace")key("del");else if(e.key==="Enter")key("enter");}else if(e.key===" "||e.key==="ArrowUp"){e.preventDefault();jump();}});
  document.addEventListener("keyup",function(e){if(e.key===" "||e.key==="ArrowUp"){var h=G.hero;h.hold=false;if(h.vy<0)h.vy*=.5;}});
  document.getElementById("kpad").addEventListener("click",function(e){var b=e.target.closest(".key");if(b){AC();key(b.getAttribute("data-k"));}});
  function mdisp(){var d=document.getElementById("mdisp");if(G.input===""){d.textContent="?";d.classList.add("ph");}else{d.textContent=G.input;d.classList.remove("ph");}}
  function key(k){if(G.state!=="gate")return;if(k==="del"){G.input=G.input.slice(0,-1);mdisp();return;}if(k==="enter"){if(G.input!=="")submit(parseInt(G.input,10));return;}if(G.input.length>=3)return;if(G.input===""&&k==="0")return;G.input+=k;mdisp();if(parseInt(G.input,10)===G.question.a*G.question.b)submit(G.question.a*G.question.b);}
  function submit(v){var ans=G.question.a*G.question.b,box=document.getElementById("mabox");
    if(v===ans){box.className="good";sGood();haptic(12);G.gates[G.nextGate].solved=true;G.coins+=5;coinBurst(G.hero.wx,G.hero.y-50);
      setTimeout(function(){mathHide();box.className="";G.state="run";G.dash=.85;G.nextGate++;G.input="";hint(G.nextGate>=G.gates.length?"Dash to the castle!":"Great! Keep going");},380);
    }else{G.hearts--;box.className="bad";sBad();haptic([10,40,10]);G.shakeT=.35;G.input="";mdisp();if(G.hearts<=0)setTimeout(function(){mathHide();G.state="fail";showOv("failOv");},420);}}

  function puff(wx,y){for(var i=0;i<7;i++)G.particles.push({wx:wx,y:y,vx:(Math.random()*2-1)*90,vy:-(Math.random()*130+40),life:.5,kind:"puff"});}
  function coinBurst(wx,y){for(var i=0;i<9;i++)G.particles.push({wx:wx,y:y,vx:(Math.random()*2-.4)*160,vy:-(Math.random()*260+120),life:.9,kind:"coin"});}
  function sparkle(wx,y){for(var i=0;i<2;i++)G.particles.push({wx:wx+(Math.random()*50-25),y:y-Math.random()*40,vx:(Math.random()*2-1)*40,vy:-(Math.random()*60+20),life:.5,kind:"star"});}
  function groundAt(wx){for(var i=0;i<G.grounds.length;i++){var s=G.grounds[i];if(wx>=s[0]&&wx<=s[1])return true;}return false;}
  function platTop(p){var ha=p.mv?p.hAbove+Math.sin(G.t*2*Math.PI/p.period+p.phase)*p.amp:p.hAbove;return GROUND-ha;}
  function pickQ(){var T=G.cf.tables;return {a:T[Math.floor(Math.random()*T.length)],b:1+Math.floor(Math.random()*12)};}

  function hideAllOv(){["mapOv","winOv","failOv"].forEach(function(id){document.getElementById(id).classList.add("hidden");});}
  function showOv(id){document.getElementById(id).classList.remove("hidden");hudShow(false);}
  function hudShow(v){document.getElementById("hud").classList.toggle("hidden",!v);document.getElementById("pmap").classList.toggle("hidden",!v);document.getElementById("tapHint").classList.toggle("hidden",!v);}
  function mathShow(){document.getElementById("mathOverlay").classList.remove("hidden");}
  function mathHide(){document.getElementById("mathOverlay").classList.add("hidden");}
  function hint(t){var el=document.getElementById("tapHint");el.textContent=t;el.classList.toggle("hidden",!t);}
  function startLevel(n){hideAllOv();reset(n);hudShow(true);hint("Tap to jump · hold higher · tap again = double-jump");}

  /* ---- loop ---- */
  var last=0;
  function frame(ts){var dt=Math.min(.045,(ts-(last||ts))/1000);last=ts;if(G){G.cloud+=dt*14;G.t+=dt;var h=G.hero;
    if(G.state==="run"){
      var sp=G.speed*(1+G.dash);G.dash=Math.max(0,G.dash-dt*1.6);h.wx+=sp*dt;h.run+=dt*sp*.03;
      var g=(h.hold&&h.vy<0)?1500:2700;h.vy+=g*dt;
      if(h.coyote>0)h.coyote-=dt;if(h.inv>0)h.inv-=dt;if(h.power>0)h.power=Math.max(0,h.power-dt);
      var ny=h.y+h.vy*dt,landTop=null;
      for(var i=0;i<G.platforms.length;i++){var p=G.platforms[i];var top=platTop(p);if(h.wx>=p.x&&h.wx<=p.x+p.w&&h.vy>=0&&h.y<=top+4&&ny>=top){if(landTop===null||top<landTop)landTop=top;}}
      if(landTop===null){if((groundAt(h.wx)||TEST)&&h.vy>=0&&ny>=GROUND&&h.y<=GROUND+4)landTop=GROUND;}
      if(landTop!==null){h.y=landTop;h.vy=0;h.ground=true;h.dbl=false;h.coyote=.1;}else{if(h.ground)h.coyote=.1;h.ground=false;h.y=ny;}
      var headY=h.y-HEROSIZE*0.9;
      for(var b=0;b<G.boxes.length;b++){var bx=G.boxes[b];if(bx.used)continue;var by=GROUND-bx.hAbove;if(h.vy<0&&h.wx>=bx.x-8&&h.wx<=bx.x+bx.w+8&&headY<=by+bx.h&&headY>=by-12){bx.used=true;bx.pop=.2;h.vy=80;G.coins++;sCoin();G.particles.push({wx:bx.x+bx.w/2,y:by-14,vx:0,vy:-220,life:.7,kind:"coin"});}}
      if(G.star&&!G.star.taken){var sy=GROUND-G.star.hAbove;if(Math.abs(G.star.x-h.wx)<50&&Math.abs(sy-(h.y-40))<66){G.star.taken=true;h.power=6.5;sStar();haptic([12,30,12]);}}
      for(var k=0;k<G.coinsA.length;k++){var co=G.coinsA[k];if(co.got)continue;var cy=GROUND-co.hAbove;var dx=co.x-h.wx,dy=cy-(h.y-40);if(h.power>0&&Math.abs(dx)<300&&Math.abs(dy)<300){co.x-=dx*Math.min(1,dt*9);co.hAbove+=dy*Math.min(1,dt*9);}if(Math.abs(co.x-h.wx)<38&&Math.abs((GROUND-co.hAbove)-(h.y-40))<54){co.got=true;G.coins++;sCoin();}}
      for(var e=0;e<G.enemies.length;e++){var en=G.enemies[e];if(!en.alive)continue;en.x+=en.dir*G.cf.enemySpeed*dt;if(en.x<en.x1){en.x=en.x1;en.dir=1;}if(en.x>en.x2){en.x=en.x2;en.dir=-1;}var eTop=GROUND-52;if(Math.abs(en.x-h.wx)<40){if(h.power>0){en.alive=false;G.coins+=3;sStomp();coinBurst(en.x,eTop);}else if(h.vy>0&&h.y<=eTop+22&&h.y>=eTop-40){en.alive=false;h.vy=-620;G.coins+=3;sStomp();haptic(15);coinBurst(en.x,eTop);}else if(!TEST&&h.inv<=0&&h.y>eTop-28){hurt();}}}
      for(var f=0;f<G.flags.length;f++){var fl=G.flags[f];if(!fl.hit&&h.wx>=fl.x){fl.hit=true;G.lastCP=fl.x;sFlag();}}
      if(h.y>GROUND+420){respawn();}
      if(G.nextGate<G.gates.length){var ga=G.gates[G.nextGate];if(!ga.solved&&h.wx>=ga.x-52){h.wx=ga.x-52;arrive();}}else if(h.wx>=G.castleX-80){win();}
      if(h.power>0&&Math.random()<.5)sparkle(h.wx,h.y-HEROSIZE*0.4);
    }
    for(var f2=0;f2<G.flags.length;f2++){var fg=G.flags[f2];if(fg.hit&&fg.raise<1)fg.raise=Math.min(1,fg.raise+dt*3);}
    for(var p2=G.particles.length-1;p2>=0;p2--){var pt=G.particles[p2];pt.wx+=pt.vx*dt;pt.vy+=1600*dt;pt.y+=pt.vy*dt;pt.life-=dt*1.1;if(pt.life<=0)G.particles.splice(p2,1);}
    if(G.shakeT>0)G.shakeT-=dt;G.cam=h.wx-HEROX;draw();hudUpdate();}
    requestAnimationFrame(frame);
  }
  function hurt(){G.hearts--;G.hero.inv=1.3;G.hero.vy=-460;G.shakeT=.3;sHurt();haptic([12,40,12]);if(G.hearts<=0){G.state="fail";showOv("failOv");}}
  function respawn(){var h=G.hero;h.wx=G.lastCP;h.y=GROUND;h.vy=0;h.inv=1;h.ground=true;}
  function arrive(){G.state="gate";G.question=pickQ();G.input="";mdisp();document.getElementById("mq").textContent=G.question.a+" × "+G.question.b;mathShow();hint("");}
  function win(){G.state="win";sWin();haptic([15,60,15,60,15]);var st=G.hearts>=3?3:G.hearts===2?2:1;document.getElementById("winStars").innerHTML=starRow(st);document.getElementById("winTitle").textContent=st===3?"Perfect run!":"Level complete!";document.getElementById("winMsg").textContent=G.coins+" coins · "+G.hearts+" hearts left"+(level<MAXLEVELS?" · next up: "+THEMES[level%THEMES.length].name+"!":" · you finished them all!");unlocked=Math.max(unlocked,Math.min(level+1,MAXLEVELS));document.getElementById("nextBtn").style.display=(level<MAXLEVELS)?"":"none";showOv("winOv");}

  /* ================= VECTOR ART ================= */
  function S(wx){return wx-G.cam;}
  function rr(px,py,w,h,r){x.beginPath();x.moveTo(px+r,py);x.arcTo(px+w,py,px+w,py+h,r);x.arcTo(px+w,py+h,px,py+h,r);x.arcTo(px,py+h,px,py,r);x.arcTo(px,py,px+w,py,r);x.closePath();}
  function starPath(cx,cy,R,r,pts){x.beginPath();for(var i=0;i<pts*2;i++){var ang=-Math.PI/2+i*Math.PI/pts,rad=i%2?r:R;var px=cx+Math.cos(ang)*rad,py=cy+Math.sin(ang)*rad;i?x.lineTo(px,py):x.moveTo(px,py);}x.closePath();}

  function draw(){
    x.save();var shx=G.shakeT>0?(Math.random()*2-1)*7:0,shy=G.shakeT>0?(Math.random()*2-1)*5:0;x.clearRect(0,0,LW,LH);x.translate(shx,shy);var th=G.theme;
    x.fillStyle=skyGrad;x.fillRect(-10,-10,LW+20,LH+20);
    if(th.night){for(var st=0;st<40;st++){var sx=(st*137)%LW,sy=(st*89)%(GROUND-40);x.fillStyle="rgba(255,255,255,"+(0.4+0.5*Math.abs(Math.sin(st+G.t)))+")";x.fillRect(sx,sy,2,2);}}
    // sun / moon
    x.save();x.translate(LW*0.82,LH*0.15);if(!th.night){x.strokeStyle="rgba(255,240,170,.5)";x.lineWidth=6;x.lineCap="round";for(var r=0;r<12;r++){x.rotate(Math.PI/6+G.t*.04);x.beginPath();x.moveTo(58,0);x.lineTo(82,0);x.stroke();}var sg=x.createRadialGradient(0,0,8,0,0,52);sg.addColorStop(0,"#fff6c8");sg.addColorStop(1,"#ffe06a");x.fillStyle=sg;x.beginPath();x.arc(0,0,48,0,7);x.fill();}else{x.fillStyle="#f2eeff";x.beginPath();x.arc(0,0,40,0,7);x.fill();x.fillStyle=th.sky[1];x.beginPath();x.arc(16,-8,36,0,7);x.fill();}x.restore();
    for(var i=0;i<6;i++){var cx=((i*260-(G.cam*.16+G.cloud))%(LW+340));if(cx<-180)cx+=LW+340;cloud(cx,LH*0.12+(i%2)*44,th.night);}
    mtns(G.cam*.2,th);
    hills(G.cam*.42,GROUND-100,th.h1);hills(G.cam*.68,GROUND-34,th.h2);
    for(var s=0;s<G.grounds.length;s++){var sp=G.grounds[s];var x1=S(sp[0]),x2=S(sp[1]);if(x2<-20||x1>LW+20)continue;x.fillStyle=th.gr;x.fillRect(x1,GROUND,x2-x1,LH);x.fillStyle=th.grD;x.fillRect(x1,GROUND+22,x2-x1,LH);x.fillStyle="rgba(255,255,255,.18)";x.fillRect(x1,GROUND,x2-x1,10);}
    if(th.water){for(var s2=0;s2<G.grounds.length-1;s2++){var a=G.grounds[s2][1],bb=G.grounds[s2+1][0];var wx1=S(a),wx2=S(bb);if(wx2<-20||wx1>LW+20)continue;x.fillStyle=th.water;x.fillRect(wx1,GROUND+8,wx2-wx1,LH);x.fillStyle="rgba(255,255,255,.35)";for(var wv=wx1;wv<wx2;wv+=22)x.fillRect(wv+((G.t*30)%22),GROUND+14,10,3);}}
    for(var tr=0;tr<G.props.length;tr++){var t2=G.props[tr];var tx=t2.x-G.cam*.82;if(tx<-80||tx>LW+80)continue;if(groundAt(t2.x))drawProp(th.prop,tx,GROUND,t2.s,.9);}
    for(var p=0;p<G.platforms.length;p++){var pl=G.platforms[p];var px=S(pl.x);if(px>LW+70||px+pl.w<-70)continue;var top=platTop(pl);x.fillStyle="#a9713f";rr(px,top,pl.w,20,8);x.fill();x.fillStyle=th.h1;rr(px+3,top-5,pl.w-6,8,4);x.fill();if(pl.mv){x.strokeStyle="rgba(255,255,255,.6)";x.lineWidth=3;x.beginPath();x.moveTo(px+pl.w/2,top+12);x.lineTo(px+pl.w/2-6,top+6);x.moveTo(px+pl.w/2,top+12);x.lineTo(px+pl.w/2+6,top+6);x.stroke();}}
    for(var b=0;b<G.boxes.length;b++){var bx=G.boxes[b];var bxs=S(bx.x);if(bxs>LW+60||bxs<-60)continue;drawBox(bxs,(GROUND-bx.hAbove)-(bx.pop?bx.pop*36:0),bx.w,bx.h,bx.used);if(bx.pop)bx.pop=Math.max(0,bx.pop-.03);}
    for(var f=0;f<G.flags.length;f++){var fl=G.flags[f];var fxs=S(fl.x);if(fxs>LW+40||fxs<-40)continue;drawFlag(fxs,GROUND,fl.raise||0,fl.half);}
    if(G.star&&!G.star.taken){var stx=S(G.star.x),sty=(GROUND-G.star.hAbove)+Math.sin(G.t*3)*8;drawStar(stx,sty,20);}
    for(var k=0;k<G.coinsA.length;k++){var co=G.coinsA[k];if(co.got)continue;var cxs=S(co.x);if(cxs>LW+30||cxs<-30)continue;drawCoin(cxs,GROUND-co.hAbove,G.t*4+co.x*.05);}
    for(var g=G.nextGate;g<G.gates.length;g++){var ga=G.gates[g];if(ga.solved)continue;var gxs=S(ga.x);if(gxs>LW+100||gxs<-100)continue;drawGate(gxs,GROUND,G.t);}
    var castxs=S(G.castleX);if(castxs<LW+160&&castxs>-160)drawCastle(castxs,GROUND);
    for(var e=0;e<G.enemies.length;e++){var en=G.enemies[e];if(!en.alive)continue;var exs=S(en.x);if(exs>LW+60||exs<-60)continue;drawEnemy(exs,GROUND,G.t,en.dir);}
    for(var fw=0;fw<G.flowers.length;fw++){var fo=G.flowers[fw];var foX=fo.x-G.cam;if(foX<-30||foX>LW+30)continue;if(groundAt(fo.x)&&!th.night)drawFlower(foX,GROUND+18,fo.k);}
    var h=G.hero;if(!(h.inv>0&&Math.floor(G.t*16)%2))drawHero(S(h.wx),h.y,h.run,h.power>0,h.ground);
    for(var q=0;q<G.particles.length;q++){var pt=G.particles[q];x.globalAlpha=Math.max(0,pt.life);if(pt.kind==="coin")drawCoin(S(pt.wx),pt.y,pt.wx);else if(pt.kind==="star")drawStar(S(pt.wx),pt.y,7);else{x.fillStyle="#fff";x.beginPath();x.arc(S(pt.wx),pt.y,3,0,7);x.fill();}x.globalAlpha=1;}
    x.restore();
  }
  function cloud(cx,cy,night){x.fillStyle=night?"rgba(220,220,255,.35)":"rgba(255,255,255,.94)";x.beginPath();x.arc(cx,cy,26,0,7);x.arc(cx+30,cy-12,34,0,7);x.arc(cx+66,cy,26,0,7);x.rect(cx-6,cy,78,26);x.fill();}
  function mtns(off,th){for(var i=-1;i<8;i++){var cx=i*430-((off)%430);var baseY=GROUND-10,h=150;x.fillStyle=th.night?"#3a2f6e":"#9db4e6";x.beginPath();x.moveTo(cx-h*1.4,baseY);x.lineTo(cx,baseY-h);x.lineTo(cx+h*1.4,baseY);x.closePath();x.fill();x.fillStyle=th.night?"#5a4aa0":"#eaf2ff";x.beginPath();x.moveTo(cx,baseY-h);x.lineTo(cx-h*.26,baseY-h*.6);x.lineTo(cx,baseY-h*.66);x.lineTo(cx+h*.26,baseY-h*.6);x.closePath();x.fill();}}
  function hills(off,base,col){x.fillStyle=col;x.beginPath();x.moveTo(-10,GROUND+8);for(var px=-10;px<=LW+10;px+=36){var y=base-Math.sin((px+off)*.006)*46-Math.cos((px+off)*.012)*20;x.lineTo(px,y);}x.lineTo(LW+10,GROUND+8);x.closePath();x.fill();}

  /* ---- props (themed scenery) ---- */
  function drawProp(type,cx,gy,s,a){x.globalAlpha=a||1;
    if(type==="tree"){x.fillStyle="#7a4a24";rr(cx-s*0.09,gy-s*0.62,s*0.18,s*0.66,4);x.fill();x.fillStyle="#3aa64a";x.beginPath();x.arc(cx,gy-s*0.72,s*0.34,0,7);x.arc(cx-s*0.26,gy-s*0.56,s*0.26,0,7);x.arc(cx+s*0.26,gy-s*0.56,s*0.26,0,7);x.fill();}
    else if(type==="palm"){x.strokeStyle="#a9743f";x.lineWidth=s*0.13;x.lineCap="round";x.beginPath();x.moveTo(cx,gy);x.quadraticCurveTo(cx-s*0.14,gy-s*0.5,cx+s*0.06,gy-s*0.9);x.stroke();var tx=cx+s*0.06,ty=gy-s*0.9;x.fillStyle="#3fae5a";for(var f=0;f<6;f++){var a2=(-Math.PI/2)+(f-2.5)*0.5;x.save();x.translate(tx,ty);x.rotate(a2);x.beginPath();x.ellipse(s*0.3,0,s*0.34,s*0.1,0,0,7);x.fill();x.restore();}x.fillStyle="#7a4a24";x.beginPath();x.arc(tx-6,ty+4,4,0,7);x.arc(tx+6,ty+6,4,0,7);x.fill();}
    else if(type==="pine"){x.fillStyle="#6a4a2a";rr(cx-s*0.06,gy-s*0.2,s*0.12,s*0.2,3);x.fill();x.fillStyle="#2f8f52";[0.0,0.22,0.42].forEach(function(o,i){var w=s*(0.4-i*0.1);x.beginPath();x.moveTo(cx-w,gy-s*(0.2+o));x.lineTo(cx,gy-s*(0.5+o));x.lineTo(cx+w,gy-s*(0.2+o));x.closePath();x.fill();});x.fillStyle="rgba(255,255,255,.85)";[0.0,0.22,0.42].forEach(function(o,i){var w=s*(0.4-i*0.1);x.beginPath();x.moveTo(cx,gy-s*(0.5+o));x.lineTo(cx-w*0.4,gy-s*(0.38+o));x.lineTo(cx+w*0.4,gy-s*(0.38+o));x.closePath();x.fill();});}
    else if(type==="candy"){x.strokeStyle="#fff";x.lineWidth=s*0.1;x.beginPath();x.moveTo(cx,gy);x.lineTo(cx,gy-s*0.5);x.stroke();var g=x.createLinearGradient(cx-s*0.3,0,cx+s*0.3,0);g.addColorStop(0,"#ff6ea9");g.addColorStop(.5,"#fff");g.addColorStop(1,"#ff6ea9");x.fillStyle=g;x.beginPath();x.arc(cx,gy-s*0.62,s*0.24,0,7);x.fill();x.strokeStyle="#ff9ec7";x.lineWidth=3;x.beginPath();x.arc(cx,gy-s*0.62,s*0.24,0.6,3.2);x.stroke();}
    else if(type==="coral"){x.strokeStyle="#ff7aa8";x.lineWidth=s*0.12;x.lineCap="round";[[0,-0.5],[-0.2,-0.4],[0.2,-0.42]].forEach(function(o){x.beginPath();x.moveTo(cx,gy);x.quadraticCurveTo(cx+o[0]*s,gy+o[1]*s*0.6,cx+o[0]*s*1.4,gy+o[1]*s);x.stroke();});x.fillStyle="#ffd15c";x.beginPath();x.arc(cx-s*0.2,gy-s*0.36,3,0,7);x.arc(cx+s*0.24,gy-s*0.4,3,0,7);x.fill();}
    else if(type==="jungle"){x.fillStyle="#2f8f42";x.beginPath();x.ellipse(cx,gy-s*0.3,s*0.34,s*0.16,-0.5,0,7);x.ellipse(cx,gy-s*0.5,s*0.3,s*0.14,0.4,0,7);x.fill();x.fillStyle="#7a4a24";rr(cx-s*0.05,gy-s*0.3,s*0.1,s*0.3,3);x.fill();}
    else if(type==="rock"){x.fillStyle="#7a5648";x.beginPath();x.moveTo(cx-s*0.3,gy);x.quadraticCurveTo(cx-s*0.34,gy-s*0.4,cx,gy-s*0.42);x.quadraticCurveTo(cx+s*0.34,gy-s*0.4,cx+s*0.3,gy);x.closePath();x.fill();x.strokeStyle="#ff6b3d";x.lineWidth=2;x.beginPath();x.moveTo(cx-6,gy-s*0.2);x.lineTo(cx,gy-s*0.32);x.lineTo(cx+5,gy-s*0.18);x.stroke();}
    else if(type==="crystal"){x.fillStyle="#b28dff";[[-0.14,-0.5,0.12],[0.16,-0.62,0.14],[0.0,-0.4,0.1]].forEach(function(o){x.beginPath();x.moveTo(cx+o[0]*s-o[2]*s,gy);x.lineTo(cx+o[0]*s,gy+o[1]*s);x.lineTo(cx+o[0]*s+o[2]*s,gy);x.closePath();x.fill();});x.strokeStyle="rgba(255,255,255,.6)";x.lineWidth=1.5;x.beginPath();x.moveTo(cx+0.16*s,gy);x.lineTo(cx+0.16*s,gy-0.62*s);x.stroke();}
    x.globalAlpha=1;
  }
  function drawFlower(cx,cy,k){var cols=[["#ff9ec7","#ff5ca8"],["#ffd15c","#ff9f1c"],["#c4a7ff","#8f5bff"]][k];x.fillStyle=cols[0];for(var i=0;i<5;i++){var a=i*Math.PI*2/5;x.beginPath();x.arc(cx+Math.cos(a)*7,cy+Math.sin(a)*7,5,0,7);x.fill();}x.fillStyle="#fff2a8";x.beginPath();x.arc(cx,cy,4,0,7);x.fill();x.fillStyle="#3aa64a";x.fillRect(cx-1.5,cy,3,10);}
  function drawCoin(cx,cy,spin){var w=Math.max(4,Math.abs(Math.cos(spin))*17);x.save();x.translate(cx,cy);var cg=x.createLinearGradient(0,-17,0,17);cg.addColorStop(0,"#ffe58a");cg.addColorStop(1,"#f2b90c");x.fillStyle=cg;x.beginPath();x.ellipse(0,0,w,17,0,0,7);x.fill();x.strokeStyle="#c9930a";x.lineWidth=2;x.stroke();if(w>7){x.fillStyle="rgba(255,255,255,.5)";x.beginPath();x.ellipse(-w*0.3,-5,w*0.24,5,0,0,7);x.fill();x.fillStyle="#e0a80a";starPath(0,1,w*0.5,w*0.22,5);x.fill();}x.restore();}
  function drawStar(cx,cy,R){x.save();var glow=x.createRadialGradient(cx,cy,2,cx,cy,R*1.8);glow.addColorStop(0,"rgba(255,225,110,.6)");glow.addColorStop(1,"rgba(255,225,110,0)");x.fillStyle=glow;x.beginPath();x.arc(cx,cy,R*1.8,0,7);x.fill();var g=x.createLinearGradient(cx,cy-R,cx,cy+R);g.addColorStop(0,"#fff1a6");g.addColorStop(1,"#ffcf33");x.fillStyle=g;starPath(cx,cy,R,R*0.45,5);x.fill();x.strokeStyle="#e8a900";x.lineWidth=2;x.stroke();x.restore();}

    g.restore();
  }
  function buildMap(){
    var W=520,Hh=300,dpr=Math.min(2,window.devicePixelRatio||1);mcv.width=W*dpr;mcv.height=Hh*dpr;mx.setTransform(dpr,0,0,dpr,0,0);mx.clearRect(0,0,W,Hh);
    var pad=54,cols=4,rows=Math.ceil(MAXLEVELS/cols);mapNodes=[];
    for(var i=0;i<MAXLEVELS;i++){var row=Math.floor(i/cols),col=i%cols;if(row%2)col=cols-1-col;var xx=pad+col*((W-2*pad)/(cols-1));var yy=pad+row*((Hh-2*pad)/(rows-1||1));mapNodes.push({x:xx,y:yy,n:i+1,theme:THEMES[i%THEMES.length]});}
    // path
    mx.strokeStyle="rgba(255,255,255,.4)";mx.lineWidth=6;mx.setLineDash([2,16]);mx.lineCap="round";mx.beginPath();mapNodes.forEach(function(p,i){i?mx.lineTo(p.x,p.y):mx.moveTo(p.x,p.y);});mx.stroke();mx.setLineDash([]);
    mapNodes.forEach(function(p){var open=p.n<=unlocked;var R=30;
      mx.save();if(!open)mx.globalAlpha=.5;
      // badge + themed icon (always shown, so you can see what each level is)
      mx.fillStyle=p.theme.soft;mx.strokeStyle=open?"#fff":"rgba(255,255,255,.5)";mx.lineWidth=4;mx.beginPath();mx.arc(p.x,p.y,R,0,7);mx.fill();mx.stroke();
      mx.save();mx.beginPath();mx.arc(p.x,p.y,R-3,0,7);mx.clip();mapIcon(p.theme,p.x,p.y-2,R*0.72);mx.restore();
      // number tag
      mx.fillStyle=(p.n===level?"#ff5ca8":"#6a41ff");mx.beginPath();mx.arc(p.x+R*0.72,p.y-R*0.72,12,0,7);mx.fill();mx.fillStyle="#fff";mx.font="900 14px ui-rounded,system-ui,sans-serif";mx.textAlign="center";mx.textBaseline="middle";mx.fillText(p.n,p.x+R*0.72,p.y-R*0.72+1);
      mx.restore();
      // small lock badge for locked levels (full opacity, at the bottom)
      if(!open){mx.fillStyle="rgba(38,26,74,.78)";mx.beginPath();mx.arc(p.x,p.y+R*0.62,11,0,7);mx.fill();mx.strokeStyle="#fff";mx.lineWidth=2.2;mx.strokeRect(p.x-4.5,p.y+R*0.62-0.5,9,7);mx.beginPath();mx.arc(p.x,p.y+R*0.62-0.5,3.2,Math.PI,0);mx.stroke();}
      // label
      mx.fillStyle=open?"#fff":"rgba(255,255,255,.62)";mx.font="800 11px ui-rounded,system-ui,sans-serif";mx.textAlign="center";mx.textBaseline="alphabetic";mx.fillText(p.theme.name,p.x,p.y+R+15);
    });
  }
  mcv.addEventListener("click",function(ev){var rect=mcv.getBoundingClientRect(),sx=520/rect.width;var mxp=(ev.clientX-rect.left)*sx,myp=(ev.clientY-rect.top)*sx;for(var i=0;i<mapNodes.length;i++){var p=mapNodes[i];if(p.n<=unlocked&&Math.hypot(mxp-p.x,myp-p.y)<34){AC();startLevel(p.n);return;}}});

  var CHARS=[{id:"unicorn",name:"Luna"},{id:"cat",name:"Pixel"},{id:"fox",name:"Rusty"}];
  function buildCharRow(){var row=document.getElementById("charRow");row.innerHTML="";CHARS.forEach(function(ch){var b=document.createElement("button");b.className="charBtn"+(ch.id===HEROTYPE?" on":"");b.innerHTML='<canvas width="108" height="108"></canvas><div class="charName">'+ch.name+'</div>';var cc=b.querySelector("canvas"),cx2=cc.getContext("2d");cx2.setTransform(2,0,0,2,0,0);var oldH=HEROSIZE,oldT=HEROTYPE;HEROSIZE=44;HEROTYPE=ch.id;var savedX=x;x=cx2;(HEROART[ch.id])(27,46,0.2,44);x=savedX;HEROSIZE=oldH;HEROTYPE=oldT;b.addEventListener("click",function(){HEROTYPE=ch.id;buildCharRow();buildMap();document.getElementById("pmapHero").innerHTML=UNI_MARK;});row.appendChild(b);});}

  window.__proto={get state(){return G?G.state:null;},get q(){return G?G.question:null;},get hearts(){return G?G.hearts:null;},get coins(){return G?G.coins:null;},get gate(){return G?G.nextGate:null;},get total(){return G?G.gates.length:null;},get level(){return level;},start:function(n){startLevel(n||1);}};
