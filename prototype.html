<meta charset="utf-8" />
<title>Quest Land — Prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#7ec8ff" />
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;}
  html,body{height:100%;overflow:hidden;background:#0b1020;font-family:ui-rounded,"SF Pro Rounded","Nunito",system-ui,sans-serif;-webkit-user-select:none;user-select:none;}
  #game{position:fixed;inset:0;}
  canvas{display:block;width:100%;height:100%;touch-action:none;}
  svg{display:block;}

  /* HUD */
  #hud{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;right:12px;display:flex;align-items:center;justify-content:space-between;pointer-events:none;font-weight:900;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.4);z-index:5;}
  #hud.hidden{display:none;}
  .pill{background:rgba(20,14,45,.34);backdrop-filter:blur(6px);border-radius:999px;padding:6px 12px;display:flex;align-items:center;gap:6px;font-size:16px;}
  .pill.mid{flex-direction:column;gap:0;line-height:1.05;text-align:center;}
  .pill.mid small{font-weight:800;opacity:.9;font-size:11px;letter-spacing:.05em;text-transform:uppercase;}
  #hudHearts{display:flex;gap:3px;}
  #hudHearts svg{width:22px;height:22px;}
  .ic{width:20px;height:20px;display:inline-block;vertical-align:-4px;}

  /* in-level progress map */
  #pmap{position:absolute;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 52px);height:20px;pointer-events:none;z-index:5;}
  #pmap.hidden{display:none;}
  #pmapTrack{position:absolute;left:0;right:0;top:7px;height:6px;border-radius:999px;background:rgba(20,14,45,.3);}
  #pmapFill{position:absolute;left:0;top:7px;height:6px;border-radius:999px;background:linear-gradient(90deg,#7be0ff,#b7ff8a);width:0%;}
  .tick{position:absolute;top:1px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#fff;border:3px solid #8b78c9;box-shadow:0 1px 3px rgba(0,0,0,.3);}
  .tick.done{border-color:#27c96a;background:#d8ffe6;}
  #pmapHero{position:absolute;top:-9px;margin-left:-11px;width:22px;height:22px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));}
  #pFlag{position:absolute;right:-6px;top:-6px;font-size:0;}

  /* overlays */
  .ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;color:#fff;padding:26px;z-index:10;}
  .ov.hidden{display:none;}
  .scrim{position:absolute;inset:0;background:radial-gradient(120% 100% at 50% 55%,rgba(24,16,52,.4),rgba(10,7,26,.82));}
  .card{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.15),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(10px);border-radius:26px;padding:24px 22px;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.5);}
  .card h1{font-size:32px;font-weight:900;margin-bottom:6px;}
  .card p{font-weight:700;opacity:.95;max-width:34ch;margin:0 auto;}
  .starrow{display:flex;gap:6px;justify-content:center;}
  .starrow svg{width:44px;height:44px;}
  .btn{border:none;border-radius:16px;padding:15px 24px;font-size:18px;font-weight:900;cursor:pointer;color:#fff;background:linear-gradient(120deg,#6a41ff,#ff3d81);box-shadow:0 10px 24px rgba(106,65,255,.5);}
  .btn.ghost{background:rgba(255,255,255,.16);box-shadow:none;}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}

  /* level select */
  #mapOv .card{max-width:520px;width:100%;padding:22px 18px;}
  #mapOv h1{background:linear-gradient(120deg,#ffd15c,#ff6ea9,#8f7bff);-webkit-background-clip:text;background-clip:text;color:transparent;}
  #levelPath{width:100%;height:auto;}
  .lvl-node{cursor:pointer;}
  .lvl-hint{margin-top:8px;font-size:13px;opacity:.85;font-weight:700;}

  /* math gate sheet */
  #mathOverlay{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;pointer-events:none;z-index:12;}
  #mathOverlay.hidden{display:none;}
  #mathOverlay .mscrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,6,26,0) 30%,rgba(10,6,26,.5) 100%);}
  #mathSheet{position:relative;pointer-events:auto;width:100%;max-width:460px;margin:0 10px calc(env(safe-area-inset-bottom,0px) + 14px);
    background:linear-gradient(180deg,#ffffff,#f3efff);border-radius:26px 26px 22px 22px;box-shadow:0 -8px 40px rgba(20,10,60,.5);padding:16px 16px 18px;animation:rise .28s cubic-bezier(.2,1,.3,1);}
  @keyframes rise{from{transform:translateY(120%);}to{transform:translateY(0);}}
  #mathSheet .tag{position:absolute;top:-15px;left:50%;transform:translateX(-50%);background:linear-gradient(120deg,#6a41ff,#ff3d81);color:#fff;font-weight:900;font-size:12px;letter-spacing:.05em;text-transform:uppercase;padding:6px 14px;border-radius:999px;box-shadow:0 6px 16px rgba(106,65,255,.5);white-space:nowrap;}
  #mq{text-align:center;font-size:42px;font-weight:900;color:#241a4a;margin:10px 0 8px;}
  #mabox{max-width:220px;margin:0 auto 8px;background:#f0ecff;border:3px solid transparent;border-radius:16px;padding:8px;text-align:center;}
  #mabox.good{border-color:#24b866;} #mabox.bad{border-color:#ff5c6c;animation:shk .35s;}
  @keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  #mdisp{font-size:38px;font-weight:900;color:#5b3df0;letter-spacing:2px;} #mdisp.ph{color:#9b93c9;opacity:.6;}
  .kpad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:340px;margin:0 auto;}
  .key{border:none;border-radius:16px;padding:14px 0;font-size:26px;font-weight:800;background:#fff;color:#241a4a;cursor:pointer;box-shadow:0 4px 0 #e3ddf5;display:flex;align-items:center;justify-content:center;}
  .key:active{transform:translateY(3px);box-shadow:none;}
  .key.enter{background:linear-gradient(120deg,#6a41ff,#ff3d81);color:#fff;box-shadow:0 4px 0 #4a2ec4;}
  .key.del{color:#8b83b5;} .key svg{width:26px;height:26px;}
  #tapHint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);text-align:center;color:#fff;font-weight:800;font-size:13px;text-shadow:0 2px 8px rgba(0,0,0,.5);pointer-events:none;opacity:.9;transition:opacity .3s;z-index:5;}
  #tapHint.hidden{opacity:0;}
</style>

<div id="game">
  <canvas id="c"></canvas>

  <div id="hud" class="hidden">
    <div class="pill" id="hudHearts"></div>
    <div class="pill mid"><span id="hudGate">Gate 1/4</span><small id="hudLevel">Level 1</small></div>
    <div class="pill" id="hudCoins"><span id="coinIcon"></span><span id="coinN">0</span></div>
  </div>

  <div id="pmap" class="hidden">
    <div id="pmapTrack"></div><div id="pmapFill"></div>
    <div id="pmapTicks"></div>
    <div id="pmapHero"></div>
  </div>

  <div id="tapHint" class="hidden">Tap to jump · hold higher · tap again = double-jump</div>

  <div id="mathOverlay" class="hidden">
    <div class="mscrim"></div>
    <div id="mathSheet">
      <div class="tag">Gate — solve to pass!</div>
      <div id="mq">7 × 8</div>
      <div id="mabox"><span id="mdisp" class="ph">?</span></div>
      <div class="kpad" id="kpad">
        <button class="key" data-k="1">1</button><button class="key" data-k="2">2</button><button class="key" data-k="3">3</button>
        <button class="key" data-k="4">4</button><button class="key" data-k="5">5</button><button class="key" data-k="6">6</button>
        <button class="key" data-k="7">7</button><button class="key" data-k="8">8</button><button class="key" data-k="9">9</button>
        <button class="key del" data-k="del" aria-label="delete"><svg viewBox="0 0 24 24"><path d="M9 6h11v12H9l-6-6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 10l4 4M16 10l-4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button><button class="key" data-k="0">0</button><button class="key enter" data-k="enter" aria-label="enter"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
    </div>
  </div>

  <div id="mapOv" class="ov">
    <div class="scrim"></div>
    <div class="card">
      <h1>Quest Land</h1>
      <p>Pick a level to play. Beat one to unlock the next!</p>
      <svg id="levelPath" viewBox="0 0 520 300" role="img" aria-label="Level map"></svg>
      <div class="lvl-hint">Locked levels open as you win.</div>
    </div>
  </div>

  <div id="winOv" class="ov hidden">
    <div class="scrim"></div>
    <div class="card">
      <h1 id="winTitle">Level complete!</h1>
      <div class="starrow" id="winStars"></div>
      <p id="winMsg"></p>
      <div class="btnrow">
        <button class="btn" id="nextBtn">Next level ➜</button>
        <button class="btn ghost" id="mapBtn">Level map</button>
      </div>
    </div>
  </div>

  <div id="failOv" class="ov hidden">
    <div class="scrim"></div>
    <div class="card">
      <h1>Out of hearts!</h1>
      <p>Give the level another go — you've got this!</p>
      <div class="btnrow">
        <button class="btn" id="retryBtn">Try again</button>
        <button class="btn ghost" id="mapBtn2">Level map</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var TEST=/[?&]test=1/.test(location.search);
  var cv=document.getElementById("c"), x=cv.getContext("2d");
  var WORLDH=760, LW=760, LH=760, DPR=1, GROUND=520, HEROX=150, skyGrad=null;
  var HEROSIZE=96, MAXLEVELS=8, unlocked=1;

  function resize(){
    DPR=Math.min(2.5, window.devicePixelRatio||1);
    var w=window.innerWidth, h=window.innerHeight;
    LH=WORLDH; LW=Math.round(WORLDH*w/h);
    GROUND=Math.round(LH*0.70); HEROX=Math.round(LW*0.20);
    cv.width=Math.round(w*DPR); cv.height=Math.round(h*DPR);
    cv.style.width=w+"px"; cv.style.height=h+"px";
    var sc=(w*DPR)/LW; x.setTransform(sc,0,0,sc,0,0);
    skyGrad=x.createLinearGradient(0,0,0,LH);
    skyGrad.addColorStop(0,"#5db4ff"); skyGrad.addColorStop(.55,"#a9dcff"); skyGrad.addColorStop(1,"#eaf8ff");
    if(G&&G.hero&&G.hero.ground)G.hero.y=GROUND;
  }
  window.addEventListener("resize",resize);

  /* ---------- level config ---------- */
  function tablesFor(n){var t=[2,5,10];if(n>=2)t=t.concat([3,4]);if(n>=3)t=t.concat([6,7]);if(n>=4)t=t.concat([8,9]);if(n>=5)t=t.concat([11,12]);return t;}
  function config(n){return {gates:Math.min(4+(n-1),8),speed:210+(n-1)*20,tables:tablesFor(n),pit:150+(n-1)*22,enemySpeed:60+(n-1)*14,moving:n>=2,hearts:3};}

  var G, level=1;
  function reset(n){
    level=n; var cf=config(n);
    G={cf:cf,state:"run",cam:0,speed:cf.speed,t:0,hearts:cf.hearts,coins:0,nextGate:0,
      hero:{wx:HEROX,y:GROUND,vy:0,ground:true,hold:false,dbl:false,coyote:0,inv:0,power:0,run:0},
      question:null,input:"",lastCP:HEROX,particles:[],cloud:0,shakeT:0,dash:0,
      grounds:[],platforms:[],boxes:[],coinsA:[],enemies:[],flags:[],gates:[],star:null,castleX:0,trees:[],flowers:[]};
    build(cf); buildPmap();
  }
  function build(cf){
    var SEG=1500,START=760,gx=[];for(var i=0;i<cf.gates;i++)gx.push(START+i*SEG);
    G.gates=gx.map(function(v){return {x:v,solved:false};});
    G.castleX=gx[gx.length-1]+SEG;
    var pits=[];for(var s=0;s<gx.length;s++){var base=gx[s]-SEG;if(base<200)continue;var pc=base+SEG*0.55;pits.push([pc,pc+cf.pit]);}
    var lastMid=gx[gx.length-1]+SEG*0.5;pits.push([lastMid,lastMid+cf.pit]);pits.sort(function(a,b){return a[0]-b[0];});
    var spans=[],cur=-400;pits.forEach(function(p){spans.push([cur,p[0]]);cur=p[1];});spans.push([cur,G.castleX+700]);G.grounds=spans;
    pits.forEach(function(p){var mid=(p[0]+p[1])/2;for(var k=-2;k<=2;k++)G.coinsA.push({x:mid+k*40,hAbove:160-Math.abs(k)*24,got:false});});
    for(var seg=0;seg<gx.length;seg++){var b=gx[seg]-SEG;if(b>200){
      for(var q=0;q<3;q++)G.boxes.push({x:b+300+q*60,hAbove:250,w:52,h:48,used:false});
      for(var c=0;c<4;c++)G.coinsA.push({x:b+540+c*48,hAbove:46,got:false});
      var mv=cf.moving&&seg%2===1;G.platforms.push({x:b+900,hAbove:210,w:160,mv:mv,amp:mv?90:0,period:2.2,phase:seg});
      for(var pc2=0;pc2<3;pc2++)G.coinsA.push({x:b+930+pc2*50,hAbove:262,got:false});
      G.enemies.push({x1:b+1060,x2:b+1260,x:b+1060,dir:1,alive:true});
    }}
    var mid2=Math.floor(gx.length/2);G.star={x:gx[mid2]-SEG*0.25,hAbove:160,taken:false};
    G.flags=[HEROX];gx.forEach(function(v){G.flags.push(v-SEG*0.35);});G.flags=G.flags.map(function(v){return {x:v,hit:v===HEROX};});
    for(var tr=0;tr<90;tr++)G.trees.push({x:tr*250+((tr*71)%160),s:52+((tr*53)%30)});
    for(var fl=0;fl<220;fl++)G.flowers.push({x:fl*84+((fl*37)%56),k:fl%3});
  }

  /* ---------- audio ---------- */
  var ac=null;function AC(){if(!ac){var A=window.AudioContext||window.webkitAudioContext;if(A)ac=new A();}return ac;}
  function tone(f,d,t,w,v){var a=AC();if(!a)return;var s=a.currentTime+(w||0),o=a.createOscillator(),g=a.createGain();o.type=t||"sine";o.frequency.value=f;g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(v||.13,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g);g.connect(a.destination);o.start(s);o.stop(s+d+.02);}
  function sCoin(){tone(880,.07,"triangle",0,.09);tone(1320,.07,"triangle",.04,.08);}
  function sJump(){tone(520,.09,"square",0,.07);}function sDbl(){tone(720,.09,"square",0,.07);}
  function sStomp(){tone(300,.08,"square",0,.11);tone(600,.1,"triangle",.06,.09);}
  function sGood(){tone(660,.1,"sine",0);tone(990,.14,"sine",.09);}function sBad(){tone(180,.22,"sine",0);}
  function sHurt(){tone(200,.2,"sawtooth",0,.11);}function sStar(){[660,880,1100,1320].forEach(function(f,i){tone(f,.12,"triangle",i*.06,.09);});}
  function sWin(){[523,659,784,1046].forEach(function(f,i){tone(f,.16,"sine",i*.11);});}
  function haptic(m){if(navigator.vibrate){try{navigator.vibrate(m);}catch(e){}}}

  /* ---------- input ---------- */
  function jump(){if(G.state!=="run")return;var h=G.hero;
    if(h.ground||h.coyote>0){h.vy=-1020;h.ground=false;h.coyote=0;h.dbl=false;h.hold=true;sJump();}
    else if(!h.dbl){h.vy=-900;h.dbl=true;h.hold=true;sDbl();puff(h.wx,h.y-40);}}
  cv.addEventListener("pointerdown",function(){AC();jump();});
  cv.addEventListener("pointerup",function(){var h=G.hero;h.hold=false;if(h.vy<0)h.vy*=.5;});
  document.addEventListener("keydown",function(e){if(G.state==="gate"){if(e.key>="0"&&e.key<="9")key(e.key);else if(e.key==="Backspace")key("del");else if(e.key==="Enter")key("enter");}else if(e.key===" "||e.key==="ArrowUp"){e.preventDefault();jump();}});
  document.addEventListener("keyup",function(e){if(e.key===" "||e.key==="ArrowUp"){var h=G.hero;h.hold=false;if(h.vy<0)h.vy*=.5;}});
  document.getElementById("kpad").addEventListener("click",function(e){var b=e.target.closest(".key");if(b){AC();key(b.getAttribute("data-k"));}});

  function mdisp(){var d=document.getElementById("mdisp");if(G.input===""){d.textContent="?";d.classList.add("ph");}else{d.textContent=G.input;d.classList.remove("ph");}}
  function key(k){if(G.state!=="gate")return;
    if(k==="del"){G.input=G.input.slice(0,-1);mdisp();return;}
    if(k==="enter"){if(G.input!=="")submit(parseInt(G.input,10));return;}
    if(G.input.length>=3)return;if(G.input===""&&k==="0")return;
    G.input+=k;mdisp();if(parseInt(G.input,10)===G.question.a*G.question.b)submit(G.question.a*G.question.b);}
  function submit(v){var ans=G.question.a*G.question.b,box=document.getElementById("mabox");
    if(v===ans){box.className="good";sGood();haptic(12);G.gates[G.nextGate].solved=true;G.coins+=5;coinBurst(G.hero.wx,G.hero.y-50);
      setTimeout(function(){mathHide();box.className="";G.state="run";G.dash=.85;G.nextGate++;G.input="";hint(G.nextGate>=G.gates.length?"Dash to the castle!":"Great! Keep going");},380);
    }else{G.hearts--;box.className="bad";sBad();haptic([10,40,10]);G.shakeT=.35;G.input="";mdisp();if(G.hearts<=0)setTimeout(function(){mathHide();G.state="fail";showOv("failOv");},420);}}

  function puff(wx,y){for(var i=0;i<7;i++)G.particles.push({wx:wx,y:y,vx:(Math.random()*2-1)*90,vy:-(Math.random()*130+40),life:.5,kind:"puff"});}
  function coinBurst(wx,y){for(var i=0;i<9;i++)G.particles.push({wx:wx,y:y,vx:(Math.random()*2-.4)*160,vy:-(Math.random()*260+120),life:.9,kind:"coin"});}
  function sparkle(wx,y){for(var i=0;i<2;i++)G.particles.push({wx:wx+(Math.random()*50-25),y:y-Math.random()*40,vx:(Math.random()*2-1)*40,vy:-(Math.random()*60+20),life:.5,kind:"star"});}

  function groundAt(wx){for(var i=0;i<G.grounds.length;i++){var s=G.grounds[i];if(wx>=s[0]&&wx<=s[1])return true;}return false;}
  function platTop(p){var ha=p.mv?p.hAbove+Math.sin(G.t*2*Math.PI/p.period+p.phase)*p.amp:p.hAbove;return GROUND-ha;}
  function pickQ(){var T=G.cf.tables;return {a:T[Math.floor(Math.random()*T.length)],b:1+Math.floor(Math.random()*12)};}

  /* ---------- screen mgmt ---------- */
  function hideAllOv(){["mapOv","winOv","failOv"].forEach(function(id){document.getElementById(id).classList.add("hidden");});}
  function showOv(id){document.getElementById(id).classList.remove("hidden");hudShow(false);}
  function hudShow(v){document.getElementById("hud").classList.toggle("hidden",!v);document.getElementById("pmap").classList.toggle("hidden",!v);document.getElementById("tapHint").classList.toggle("hidden",!v);}
  function mathShow(){document.getElementById("mathOverlay").classList.remove("hidden");}
  function mathHide(){document.getElementById("mathOverlay").classList.add("hidden");}
  function hint(t){var el=document.getElementById("tapHint");el.textContent=t;el.classList.toggle("hidden",!t);}
  function startLevel(n){hideAllOv();reset(n);hudShow(true);hint("Tap to jump · hold higher · tap again = double-jump");}

  /* ---------- loop ---------- */
  var last=0;
  function frame(ts){
    var dt=Math.min(.045,(ts-(last||ts))/1000);last=ts;if(G){G.cloud+=dt*14;G.t+=dt;var h=G.hero;
    if(G.state==="run"){
      var sp=G.speed*(1+G.dash);G.dash=Math.max(0,G.dash-dt*1.6);h.wx+=sp*dt;h.run+=dt*sp*.03;
      var g=(h.hold&&h.vy<0)?1500:2700;h.vy+=g*dt;
      if(h.coyote>0)h.coyote-=dt;if(h.inv>0)h.inv-=dt;if(h.power>0)h.power=Math.max(0,h.power-dt);
      var ny=h.y+h.vy*dt,landTop=null;
      for(var i=0;i<G.platforms.length;i++){var p=G.platforms[i];var top=platTop(p);if(h.wx>=p.x&&h.wx<=p.x+p.w&&h.vy>=0&&h.y<=top+4&&ny>=top){if(landTop===null||top<landTop)landTop=top;}}
      if(landTop===null){if((groundAt(h.wx)||TEST)&&h.vy>=0&&ny>=GROUND&&h.y<=GROUND+4)landTop=GROUND;}
      if(landTop!==null){h.y=landTop;h.vy=0;h.ground=true;h.dbl=false;h.coyote=.1;}else{if(h.ground)h.coyote=.1;h.ground=false;h.y=ny;}
      var headY=h.y-HEROSIZE*0.9;
      for(var b=0;b<G.boxes.length;b++){var bx=G.boxes[b];if(bx.used)continue;var by=GROUND-bx.hAbove;if(h.vy<0&&h.wx>=bx.x-8&&h.wx<=bx.x+bx.w+8&&headY<=by+bx.h&&headY>=by-12){bx.used=true;bx.pop=.2;h.vy=80;G.coins++;sCoin();G.particles.push({wx:bx.x+bx.w/2,y:by-14,vx:0,vy:-220,life:.7,kind:"coin"});}}

  function buildMap(){
    var svg=document.getElementById("levelPath");var W=520,Hh=300,pad=46;svg.innerHTML="";
    var pts=[];for(var i=0;i<MAXLEVELS;i++){var col=i%4;var row=Math.floor(i/4);var xx=pad+col*((W-2*pad)/3);var yy=row%2? (Hh-pad-30):(pad+30);

      if(!open){tx.textContent="";var lock=document.createElementNS("http://www.w3.org/2000/svg","path");lock.setAttribute("d","M"+(pt.x-6)+" "+(pt.y-1)+" h12 v9 h-12 z M"+(pt.x-3)+" "+(pt.y-1)+" v-3 a3 3 0 0 1 6 0 v3");lock.setAttribute("fill","none");lock.setAttribute("stroke","rgba(255,255,255,.6)");lock.setAttribute("stroke-width","2");g.appendChild(lock);}else g.appendChild(tx);
